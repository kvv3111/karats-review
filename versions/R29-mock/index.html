<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>KARATS AUTO · Maqueta: menú y ficha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
  #hall { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 50%; }
  .top { position:fixed; top:0; left:0; right:0; padding:calc(14px + env(safe-area-inset-top)) 18px 20px 26px; display:flex; justify-content:space-between; align-items:center; z-index:9;
         background:linear-gradient(rgba(239,236,230,.82),rgba(239,236,230,0)); pointer-events:none; }
  .brand { font-family:Jost,sans-serif; font-weight:400; letter-spacing:.34em; font-size:clamp(17px, 1.55vw, 30px); line-height:1.1; text-align:center; }
  .brand span { margin-right:-.34em; } .brand small { display:block; font-size:.38em; letter-spacing:.9em; margin-right:-.9em; color:var(--soft); margin-top:.5em; }
  #menuBtn { pointer-events:auto; z-index:9; }
  #menuBtn i { position:absolute; left:14px; width:16px; height:1.6px; border-radius:1px; background:var(--ink); z-index:1; transition:transform .45s var(--spring), top .45s var(--spring); }
  #menuBtn i:nth-child(1) { top:18px; } #menuBtn i:nth-child(2) { top:24px; }
  body.menu #menuBtn i:nth-child(1) { top:21px; transform:rotate(45deg); } body.menu #menuBtn i:nth-child(2) { top:21px; transform:rotate(-45deg); }

  .bar { position:fixed; left:0; right:0; bottom:0; padding:40px 22px calc(84px + env(safe-area-inset-bottom)); display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
         background:linear-gradient(rgba(239,236,230,0),rgba(239,236,230,.9) 55%); }
  .bar h2 { font-family:Jost,sans-serif; font-size:23px; font-weight:500; } .bar p { color:var(--soft); margin-top:2px; } .bar b { color:var(--ink); }
  .bar .btn { height:46px; padding:0 18px; }
  .dots { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 25px); transform:translateX(-50%); width:132px; height:34px; border-radius:17px; display:flex; align-items:center; justify-content:center; gap:14px; }
  .dots i { width:5px; height:5px; border-radius:3px; background:rgba(29,33,30,.30); position:relative; z-index:1; } .dots i.on { width:16px; background:rgba(29,33,30,.88); }

  /* ---------- menu: glass panel from the top, hall blurred beneath ---------- */
  #veil { position:fixed; inset:0; z-index:7; background:rgba(239,236,230,.18); -webkit-backdrop-filter:blur(0px); backdrop-filter:blur(0px); opacity:0; pointer-events:none;
          transition:opacity .4s var(--ease), backdrop-filter .5s var(--ease), -webkit-backdrop-filter .5s var(--ease); }
  body.menu #veil, body.sheet #veil { opacity:1; pointer-events:auto; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  #menu { --lg-tint:.60; position:fixed; z-index:8; top:calc(10px + env(safe-area-inset-top)); left:10px; right:10px; max-width:440px; margin-left:auto; border-radius:var(--r-xl);
          padding:72px 10px 14px; transform-origin:calc(100% - 32px) 22px; transform:scale(.18, .08); opacity:0; pointer-events:none;
          transition:transform .55s var(--spring), opacity .25s var(--ease); }
  body.menu #menu { transform:none; opacity:1; pointer-events:auto; }
  #menu nav a { display:flex; align-items:center; gap:14px; padding:13px 16px; border-radius:18px; text-decoration:none; position:relative; z-index:1;
                opacity:0; transform:translateY(-8px); transition:opacity .35s var(--ease), transform .45s var(--spring), background .2s; }
  body.menu #menu nav a { opacity:1; transform:none; }
  #menu nav a:active { background:rgba(255,255,255,.45); }
  #menu nav a .n { font-family:Jost,sans-serif; font-size:12px; color:var(--faint); letter-spacing:.1em; width:22px; }
  #menu nav a .t { flex:1; } #menu nav a .t b { display:block; font-family:Jost,sans-serif; font-weight:400; font-size:25px; letter-spacing:.01em; line-height:1.15; }
  #menu nav a .t small { color:var(--soft); font-size:13px; }
  #menu nav a svg { width:18px; height:18px; color:var(--faint); }
  #menu .foot { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:12px 6px 0; padding-top:14px; border-top:1px solid var(--line); position:relative; z-index:1; }
  .seg { position:relative; display:flex; height:40px; padding:3px; border-radius:20px; background:rgba(29,33,30,.06); box-shadow:inset 0 0 0 .6px rgba(29,33,30,.08); }
  .seg button { position:relative; z-index:2; width:46px; border:0; background:none; font-size:13px; font-weight:600; letter-spacing:.06em; cursor:pointer; color:var(--soft); transition:color .25s; }
  .seg button.on { color:var(--ink); }
  .seg .knob { position:absolute; z-index:1; top:3px; left:3px; width:46px; height:34px; border-radius:17px; transition:transform .5s var(--spring); }
  .foot .acts { display:flex; gap:8px; }
  .foot .gbtn.wa { background:#1f8f55; color:#fff; box-shadow:0 8px 20px rgba(31,143,85,.28); }

  /* ---------- car sheet: glass bottom sheet, draggable ---------- */
  #sheet { --lg-tint:.66; position:fixed; z-index:8; left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; border-radius:var(--r-xl);
           padding:10px 18px 18px; transform:translateY(calc(100% + 30px)); transition:transform .6s var(--spring); touch-action:none; }
  body.sheet #sheet { transform:translateY(var(--dy, 0px)); }
  #sheet.drag { transition:none; }
  #sheet > * { position:relative; z-index:1; }
  .grab { width:38px; height:5px; border-radius:3px; background:rgba(29,33,30,.22); margin:0 auto 12px; }
  .sh-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .sh-head h3 { font-family:Jost,sans-serif; font-weight:500; font-size:27px; line-height:1.1; letter-spacing:.005em; }
  .sh-head .trim { color:var(--soft); font-size:14px; margin-top:3px; }
  .sh-head .x { flex:none; width:34px; height:34px; border-radius:17px; }
  .sh-head .x svg { width:15px; height:15px; }
  .price { display:flex; align-items:baseline; gap:10px; margin:12px 0 12px; }
  .price b { font-family:Jost,sans-serif; font-weight:500; font-size:30px; letter-spacing:.01em; }
  .price span { color:var(--soft); font-size:14px; }
  .chips { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; margin:0 -18px; padding:0 18px 2px; } .chips::-webkit-scrollbar { display:none; }
  .thumbs { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin:14px 0 12px; }
  .thumbs button { position:relative; aspect-ratio:3/2; border:0; border-radius:12px; overflow:hidden; cursor:pointer; background:#ddd center/cover; transition:transform .35s var(--spring); }
  .thumbs button:active { transform:scale(.95); }
  .thumbs button.more::after { content:attr(data-more); position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; font-size:15px; background:rgba(20,22,20,.42); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  .hl { list-style:none; display:flex; flex-direction:column; gap:7px; margin:2px 0 16px; }
  .hl li { display:flex; align-items:center; gap:9px; font-size:14.5px; } .hl svg { width:17px; height:17px; color:var(--acc); flex:none; }
  .sh-acts { display:grid; grid-template-columns:1fr 1fr 52px; gap:8px; }
  .sh-acts .btn { padding:0 12px; } .sh-acts .round { width:52px; height:52px; padding:0; border-radius:26px; }
  .label { position:absolute; top:10px; right:58px; }
  @media (min-width:900px) {
    #sheet { left:auto; right:24px; bottom:24px; width:420px; }
    .bar { padding-bottom:calc(30px + env(safe-area-inset-bottom)); } .dots { bottom:28px; }
  }
</style>
</head>
<body>
<picture><source media="(orientation:portrait)" srcset="hall_m.webp"><img id="hall" src="hall_f.webp" alt=""></picture>
<div class="top"><div class="brand"><span>KARATS</span><small>AUTO</small></div>
  <button class="gbtn lg" id="menuBtn" aria-label="Menú"><i></i><i></i></button></div>
<div class="bar"><div><h2 id="bName"></h2><p id="bMeta"></p></div><button class="btn primary" id="open"><span>Ver coche</span></button></div>
<div class="dots lg"><i></i><i class="on"></i><i></i><i></i><i></i></div>

<div id="veil"></div>
<div id="menu" class="lg" role="dialog" aria-label="Menú">
  <nav>
    <a href="#"><span class="n">01</span><span class="t"><b>Coches</b><small>5 en el showroom · ver todos</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></a>
    <a href="#"><span class="n">02</span><span class="t"><b>Sobre nosotros</b><small>Quiénes somos y cómo trabajamos</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></a>
    <a href="#"><span class="n">03</span><span class="t"><b>Ventajas</b><small>Garantía, revisión, entrega</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></a>
    <a href="#"><span class="n">04</span><span class="t"><b>Cómo comprar</b><small>De la reserva a las llaves en 4 pasos</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></a>
    <a href="#"><span class="n">05</span><span class="t"><b>Contacto</b><small>Barcelona · lun–sáb 10:00–20:00</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></a>
  </nav>
  <div class="foot">
    <div class="seg" id="lang"><span class="knob lg"></span><button class="on">ES</button><button>EN</button><button>RU</button></div>
    <div class="acts">
      <a class="gbtn lg" href="#" aria-label="Llamar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg></a>
      <a class="gbtn wa" href="#" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 001.8-1.2 2.2 2.2 0 00.1-1.2c0-.1-.2-.2-.5-.3z"/></svg></a>
    </div>
  </div>
</div>

<div id="sheet" class="lg" role="dialog" aria-label="Ficha">
  <div class="grab"></div>
  <div class="sh-head"><div><span class="demo-tag">Datos de ejemplo</span><h3 id="sName"></h3><div class="trim" id="sTrim"></div></div>
    <button class="gbtn lg x" id="sClose" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="price"><b id="sPrice"></b><span id="sMonthly"></span></div>
  <div class="chips" id="sChips"></div>
  <div class="thumbs" id="sThumbs"></div>
  <ul class="hl" id="sHl"></ul>
  <div class="sh-acts">
    <a class="btn primary" id="sMore" href="#"><span>Más detalles</span></a>
    <a class="btn lg" id="sGal" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg><span>Galería</span></a>
    <a class="btn wa round" href="#" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.7 11.8 11.8 0 004.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 001.8-1.2 2.2 2.2 0 00.1-1.2c0-.1-.2-.2-.5-.3z"/></svg></a>
  </div>
</div>
<script src="cars.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id), C = KARATS_CARS[1], SH = KARATS_SHOTS;
  const ico = { cal:'<path d="M4 7a2 2 0 012-2h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2zM4 10h16M9 3v4M15 3v4"/>', road:'<path d="M5 20L9 4M19 20L15 4M12 6v2M12 11v2M12 16v2"/>',
                fuel:'<path d="M4 20V5a1 1 0 011-1h8a1 1 0 011 1v15M3 20h12M14 9h2a2 2 0 012 2v5a1.5 1.5 0 003 0V8l-3-3M7 8h4"/>', gear:'<circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><path d="M6 8v8M12 8v8M18 8v4H6"/>',
                ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.5L16 9.5"/>' };
  const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  $("bName").textContent = C.brand + " " + C.model; $("bMeta").innerHTML = `${C.year} · ${fmtKM(C.km)} · <b>${fmtEUR(C.price)}</b>`;
  $("sName").textContent = C.brand + " " + C.model; $("sTrim").textContent = C.trim;
  $("sPrice").textContent = fmtEUR(C.price); $("sMonthly").textContent = `o desde ${C.monthly} €/mes`;
  $("sChips").innerHTML = [[ico.cal, C.year], [ico.road, fmtKM(C.km)], [ico.fuel, C.fuel], [ico.gear, C.gear.split(" ")[0]]].map(([i, t]) => `<span class="chip">${svg(i)}${t}</span>`).join("");
  $("sHl").innerHTML = C.highlights.map(t => `<li>${svg(ico.ok)}${t}</li>`).join("");
  const pick = ["01_front34", "04_rear34", "08_wheel", "03_side"];
  $("sThumbs").innerHTML = pick.map((s, k) => `<button style="background-image:url(gal/ph/${s}_t.webp)" ${k === 3 ? `class="more" data-more="+${SH.length - 3}"` : ""} data-shot="${s}"></button>`).join("");
  $("sMore").href = `coche.html?id=${C.id}`; $("sGal").href = `coche.html?id=${C.id}#galeria`;
  $("sThumbs").onclick = e => { const b = e.target.closest("button"); if (b) location.href = `coche.html?id=${C.id}#foto-${b.dataset.shot}`; };
  const B = document.body;
  $("menuBtn").onclick = () => { B.classList.remove("sheet"); B.classList.toggle("menu"); };
  $("open").onclick = () => { B.classList.remove("menu"); B.style.setProperty("--dy", "0px"); B.classList.add("sheet"); };
  $("veil").onclick = $("sClose").onclick = () => B.classList.remove("menu", "sheet");
  const nav = [...document.querySelectorAll("#menu nav a")]; nav.forEach((a, k) => a.style.transitionDelay = (60 + k * 35) + "ms");
  // language switch: glass knob springs to the tapped language
  const L = [...document.querySelectorAll("#lang button")];
  L.forEach((b, k) => b.onclick = () => { L.forEach(x => x.classList.remove("on")); b.classList.add("on"); document.querySelector("#lang .knob").style.transform = `translateX(${k * 46}px)`; });
  // drag the sheet down to close it
  const sh = $("sheet"); let y0 = null, dy = 0;
  sh.addEventListener("pointerdown", e => { if (e.target.closest("a,button")) return; y0 = e.clientY; dy = 0; sh.classList.add("drag"); sh.setPointerCapture(e.pointerId); });
  sh.addEventListener("pointermove", e => { if (y0 === null) return; dy = e.clientY - y0; dy = dy < 0 ? dy / 6 : dy; B.style.setProperty("--dy", dy + "px"); });
  const up = () => { if (y0 === null) return; y0 = null; sh.classList.remove("drag"); if (dy > 110) B.classList.remove("sheet"); B.style.setProperty("--dy", "0px"); };
  sh.addEventListener("pointerup", up); sh.addEventListener("pointercancel", up);
  const st = new URLSearchParams(location.search).get("state"); if (st) B.classList.add(st);
})();
</script>
</body>
</html>
