function read(key,fallback){try{const raw=localStorage.getItem(PREFIX+key);if(raw===null)return fallback;const expiry=Number(localStorage.getItem(PREFIX+key+'-expires'));if(!Number.isFinite(expiry)||expiry<=Date.now()){localStorage.removeItem(PREFIX+key);localStorage.removeItem(PREFIX+key+'-expires');return fallback}return JSON.parse(raw)??fallback}catch{return fallback}}
function save(key,value){try{localStorage.setItem(PREFIX+key+'-expires',String(Date.now()+RETENTION_MS));localStorage.setItem(PREFIX+key,JSON.stringify(value));return true}catch{storageOK=false;return false}}

const legalPages={
legal:{title:'Aviso legal del prototipo.',eyebrow:'NO ES UN SITIO COMERCIAL OPERATIVO',html:`<div class="legal-alert"><p><strong>Este archivo es una demostración privada.</strong> No admite compras, reservas, pagos ni solicitudes comerciales. Los perfiles de vehículos, kilómetros e importes son ficticios. Las ilustraciones generadas no documentan vehículos reales.</p></div><h2>Identificación del futuro vendedor</h2><p>Karats Auto se usa aquí como nombre de proyecto. No se atribuye a una sociedad concreta ni se publican identificadores inventados. Antes de abrir el sitio deberán completarse y verificarse la denominación social, NIF, domicilio, contacto directo y datos de inscripción registral que correspondan.</p><h2>Qué no puede publicarse todavía</h2><ul><li>Un catálogo real sin verificar disponibilidad, propiedad, documentación, estado, kilometraje y precio total.</li><li>Condiciones de financiación, garantías comerciales o servicios no confirmados.</li><li>Formularios reales sin responsable, finalidad, base jurídica, destinatarios, plazos y vías para ejercer derechos.</li><li>Textos de contratación sin definir si existe contratación a distancia y qué normativa territorial se aplica.</li></ul><h2>Estado de revisión</h2><p>El prototipo incorpora controles de privacidad y accesibilidad, pero no acredita por sí solo cumplimiento jurídico completo. La publicación queda condicionada a revisar las obligaciones aplicables a la entidad, su localización y su modelo de venta. Si la actividad queda sujeta a las obligaciones lingüísticas de Catalunya, será necesaria la correspondiente información comercial y contractual en catalán; este prototipo solo está en español.</p><h2>Propiedad e imágenes</h2><p>El emblema y los iconos de esta propuesta se han dibujado para Karats Auto. No se afirma registro de marca ni exclusividad jurídica. Las imágenes son ilustraciones generadas. Deben sustituirse por fotografías autorizadas de cada vehículo para un catálogo comercial.</p>`},
privacy:{title:'Privacidad, sin rodeos.',eyebrow:'INFORMACIÓN SOBRE ESTE ARCHIVO',html:`<div class="legal-alert"><p><strong>No pedimos nombre, teléfono, correo ni documentos.</strong> La consulta de demostración funciona en memoria y no se envía a Karats Auto ni a terceros. No hay analítica, píxeles publicitarios, mapas, fuentes remotas ni servicios incrustados.</p></div><h2>Información local en tu navegador</h2><p>Si utilizas favoritos, guardas una búsqueda o cambias las animaciones, esas preferencias pueden guardarse en el almacenamiento local de este navegador. No se transmiten desde este archivo. El buscador y la comparación funcionan en memoria salvo que solicites guardar la búsqueda.</p><h2>Consultas de demostración</h2><p>Solo eliges un tema de consulta predefinido. No se solicitan datos personales ni existe un envío. Al cerrar o recargar el archivo, el borrador no guardado desaparece.</p><h2>Antes de una versión pública</h2><p>Esta explicación no sustituye la política de privacidad del futuro responsable del tratamiento. Será necesario identificarlo y documentar las finalidades, bases jurídicas, proveedores, transferencias, plazos de conservación y derechos que correspondan a la operativa real. No se añade una casilla de publicidad ni se convierte una consulta en autorización de marketing.</p><a class="btn outline" href="#/cookies">Gestionar preferencias locales ${icon('arrow')}</a>`},
cookies:{title:'Sin rastreo por defecto.',eyebrow:'COOKIES Y PREFERENCIAS',html:`<div class="legal-alert"><p><strong>Este prototipo no instala cookies ni carga rastreadores.</strong> Imágenes, fuentes, scripts e iconos están integrados en el archivo. No existe ninguna conexión de analítica, publicidad o redes sociales.</p></div><h2>Qué se guarda si tú lo utilizas</h2><div class="data-row"><span>karats-v2-favorites</span><span>Tus favoritos, al marcarlos o desmarcarlos</span></div><div class="data-row"><span>karats-v2-filters</span><span>Filtros, solo al pulsar «Guardar búsqueda»</span></div><div class="data-row"><span>karats-v2-motion</span><span>Tu ajuste de animación, al cambiarlo</span></div><p style="margin-top:18px">Se utiliza localStorage. Cada preferencia caduca a los 30 días de su último guardado y se elimina al volver a acceder después del vencimiento. Puedes borrarla antes aquí o en tu navegador. Las claves terminadas en -expires guardan únicamente su fecha de caducidad, no un identificador de seguimiento. Solo son accesibles desde el contexto de almacenamiento del archivo o del sitio. El comportamiento de archivos locales puede variar entre navegadores.</p><h2>Tu control</h2><p>Puedes borrar las preferencias guardadas sin dejar de explorar la demostración. Si el navegador bloquea el almacenamiento, favoritos y filtros seguirán funcionando durante la visita, sin persistencia garantizada.</p><button class="btn outline" data-clear-storage>${icon('trash')}Borrar preferencias locales</button><h2>Si se añaden servicios externos</h2><p>Antes de activar analítica o publicidad será necesario evaluar los tratamientos y tecnologías, informar de ellos y aplicar el consentimiento previo cuando corresponda. No se muestra un banner de aceptación decorativo para rastreadores que no existen.</p>`},
accessibility:{title:'Pensado para distintas formas de navegar.',eyebrow:'ACCESIBILIDAD DEL PROTOTIPO',html:`<p>La interfaz incluye navegación por teclado, foco visible, etiquetas de controles, texto alternativo, diálogo modal nativo y adaptación a pantallas pequeñas. Las animaciones respetan la preferencia «reducir movimiento» del sistema y pueden pausarse.</p><h2>Controles disponibles</h2><ul><li>«Saltar al contenido» al empezar a navegar con el teclado.</li><li>Escape para cerrar menús, comparación, filtros y ampliaciones.</li><li>Controles táctiles de tamaño amplio; filtros en panel inferior en móvil.</li><li>Ampliación de texto y estructura de una columna en pantallas estrechas.</li><li>Alternativa mediante botones a los gestos de la galería.</li></ul><h2>Alcance</h2><p>Esto no es una certificación de conformidad WCAG ni una declaración jurídica de accesibilidad. Antes de publicar deben completarse pruebas con tecnologías de apoyo y determinar las obligaciones aplicables al servicio real, incluidas las que pudieran derivarse de la Ley 11/2023.</p><button class="btn outline" data-motion aria-pressed="${!motionEnabled()}">${icon(motionEnabled()?'pause':'play')}${motionEnabled()?'Pausar animaciones':'Activar animaciones'}</button>`}
};
function legalPage(key){const p=legalPages[key];return `<article class="wrap legal-page"><div class="label">${p.eyebrow}</div><h1 tabindex="-1">${p.title}</h1>${p.html}<p style="margin-top:32px"><a href="#/stock">Volver al catálogo de ejemplo</a></p></article>`}
function watchReveals(){observer?.disconnect();const els=document.querySelectorAll('.reveal');if(!motionEnabled()||!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in-view'));return}observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view');observer.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px 15px 0px'});els.forEach(e=>observer.observe(e))}
function render(focus=false){closeModal();activeCar=null;let route=(location.hash.slice(1)||'/').split('/').filter(Boolean);let key=route[0]||'home',content,title;if(key==='stock'){content=stock();title='Catálogo de ejemplo'}else if(key==='car'){const c=cars.find(c=>c.id===route[1]);if(c){content=detail(c);title=c.name+' · Ejemplo'}else{content=`<div class="wrap section"><h1 tabindex="-1">Este ejemplo no existe.</h1><a class="text-link" href="#/stock">Volver al catálogo ${icon('arrow')}</a></div>`;title='Ejemplo no encontrado'}}else if(key==='method'){content=`<div class="wrap section"><div class="label">NUESTRA FORMA DE HACERLO</div><h1 tabindex="-1" style="margin-top:20px">Elegir con criterio.</h1></div>${methodContent()}`;title='Nuestra forma de hacerlo'}else if(legalPages[key]){content=legalPage(key);title=legalPages[key].title}else{content=home();title='Tu próximo coche. Bien elegido.'}
root.innerHTML=header(key)+`<main id="main" tabindex="-1" class="route-enter">${content}</main>`+footer();document.title=title+' | Karats Auto · Prototipo';document.body.classList.toggle('has-mobile-buy',!!activeCar);window.scrollTo({top:0,behavior:'instant'});applyMotion();watchReveals();updateCompare();bindGallery();if(focus)document.querySelector('main h1')?.focus({preventScroll:true})}
function updateResults(){const r=document.getElementById('results');if(!r)return;const list=selectedCars();r.innerHTML=list.map(card).join('')||empty();document.getElementById('result-count').textContent=`${list.length} ${list.length===1?'ejemplo':'ejemplos'}`;document.querySelector('[data-only-favorites]')?.setAttribute('aria-pressed',String(onlyFavorites));document.querySelectorAll('[data-apply-filters]').forEach(b=>b.innerHTML=`Ver ${list.length} ${list.length===1?'ejemplo':'ejemplos'} ${icon('arrow')}`);watchReveals()}
function syncFilters(){document.querySelectorAll('[data-filter]').forEach(e=>e.value=filter[e.dataset.filter]||'');const s=document.getElementById('search');if(s)s.value=filter.search;const sort=document.querySelector('[data-sort]');if(sort)sort.value=filter.sort}
function updateCompare(){document.querySelector('.compare-bar')?.remove();document.body.classList.toggle('has-comparison',compare.size>0);if(!compare.size)return;const el=document.createElement('aside');el.className='compare-bar';el.setAttribute('aria-label','Selección para comparar');el.innerHTML=`<span>${compare.size} / 3 seleccionados</span><div class="compare-bar-actions"><button class="btn light" data-show-compare>Comparar ${icon('compare')}</button><button class="icon-button" data-clear-compare aria-label="Vaciar comparación">${icon('close')}</button></div>`;document.body.append(el)}
function toast(text){toastEl.textContent=text;toastEl.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('on'),3500)}
function openModal(title,body,cls=''){if(modal.open){modal.close();document.body.classList.remove('lock')}previousFocus=document.activeElement;modal.className=cls;modal.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-button" data-close aria-label="Cerrar diálogo">${icon('close')}</button></div><div class="modal-body">${body}</div>`;modal.setAttribute('aria-labelledby','modal-title');modal.showModal();document.body.classList.add('lock')}
function closeModal(){if(modal.open)modal.close();document.body.classList.remove('lock');document.querySelector('[data-menu]')?.setAttribute('aria-expanded','false')}
modal.addEventListener('close',()=>{if(!modal.open){document.body.classList.remove('lock');document.querySelector('[data-menu]')?.setAttribute('aria-expanded','false');if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true})}});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
function showCompare(){const list=[...compare].map(id=>cars.find(c=>c.id===id)).filter(Boolean);if(!list.length){toast('Selecciona al menos un ejemplo.');return}openModal('Compara con perspectiva.',`<div class="comparison-scroll" tabindex="0" role="region" aria-label="Tabla de comparación, desliza horizontalmente"><table><caption>Datos ficticios. En móvil puedes desplazar la tabla horizontalmente.</caption><thead><tr><th scope="col">Ejemplo</th>${list.map(c=>`<th scope="col"><img src="${IMAGES[c.img]}" alt="Ilustración ${c.body.toLowerCase()}"><a href="#/car/${c.id}">${c.name}</a></th>`).join('')}</tr></thead><tbody>${[['Precio ficticio',c=>euro(c.price)],['Año',c=>c.year],['Kilómetros ficticios',c=>number(c.km)+' km'],['Cambio',c=>c.gear],['Combustible',c=>c.fuel],['Estado',()=> 'Solo demostración']].map(([label,fn])=>`<tr><th scope="row">${label}</th>${list.map(c=>`<td>${fn(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,'comparison')}
function showInquiry(id){requestChoice='Información general';const c=cars.find(c=>c.id===id);openModal('Así sería tu consulta.',`<p>Prueba el recorrido sin introducir datos personales. Nada se envía y no se crea ninguna reserva.</p>${c?`<div class="inquiry-summary"><strong>${c.name}</strong><small>${euro(c.price)} · importe ficticio</small></div>`:''}<div class="request-options" aria-label="Tema de ejemplo">${['Información general','Historial y estado','Precio y condiciones'].map((x,i)=>`<button data-request="${x}" aria-pressed="${i===0}">${icon(i===0?'info':i===1?'history':'document')}<span>${x}</span>${icon('arrow')}</button>`).join('')}</div><button class="btn" data-prepare-query>Preparar ejemplo ${icon('arrow')}</button>`)}
function galleryView(value){const stage=document.querySelector('.gallery-stage');if(!stage)return;stage.dataset.view=value;document.querySelectorAll('[data-gallery]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.gallery===value)))}
function bindGallery(){const stage=document.querySelector('.gallery-stage');if(!stage)return;let x=0,y=0,swiped=false;stage.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY;swiped=false},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){galleryView(stage.dataset.view==='full'?'detail':'full');swiped=true}},{passive:true});stage.addEventListener('click',e=>{if(swiped){e.stopPropagation();e.preventDefault();swiped=false}},true)}
document.addEventListener('input',e=>{if(e.target.id==='search'){filter.search=e.target.value;updateResults()}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-filter]')){filter[t.dataset.filter]=t.value;syncFilters();updateResults()}if(t.matches('[data-sort]')){filter.sort=t.value;updateResults()}if(t.matches('[data-compare]')){const id=t.dataset.compare;if(compare.has(id))compare.delete(id);else if(compare.size<3)compare.add(id);else{t.checked=false;toast('Puedes comparar hasta tres ejemplos.')}document.querySelectorAll(`[data-compare="${id}"]`).forEach(el=>el.checked=compare.has(id));updateCompare()}});
document.addEventListener('click',e=>{const b=e.target.closest('button,a[data-scroll]');if(!b)return;
if(b.hasAttribute('data-close'))closeModal();
if(b.hasAttribute('data-menu')){openModal('Explora Karats.',`<nav class="modal-menu" aria-label="Menú móvil"><a href="#/stock">Explorar coches</a><a href="#/method">Nuestra forma de hacerlo</a><a href="#/legal">Información legal</a></nav><button class="btn" data-inquiry>Probar una consulta ${icon('chat')}</button>`);b.setAttribute('aria-expanded','true')}
if(b.hasAttribute('data-favorite-page')){onlyFavorites=true;if(location.hash==='#/stock')updateResults();else location.hash='/stock'}
if(b.hasAttribute('data-fav')){const id=b.dataset.fav;if(favorites.has(id))favorites.delete(id);else favorites.add(id);const stored=save('favorites',[...favorites]);document.querySelectorAll(`[data-fav="${id}"]`).forEach(el=>{el.setAttribute('aria-pressed',String(favorites.has(id)));el.setAttribute('aria-label',`${favorites.has(id)?'Quitar de':'Añadir a'} favoritos: ${cars.find(c=>c.id===id).name}`)});document.querySelectorAll('[data-favorite-count]').forEach(el=>{el.hidden=!favorites.size;el.textContent=favorites.size});if(onlyFavorites)updateResults();toast(stored?(favorites.has(id)?'Guardado en tus favoritos.':'Eliminado de favoritos.'):'Preferencia temporal: el navegador bloquea el guardado.')}
if(b.hasAttribute('data-only-favorites')){onlyFavorites=!onlyFavorites;updateResults()}
if(b.hasAttribute('data-reset')){filter=freshFilter();onlyFavorites=false;syncFilters();updateResults();toast('Búsqueda restablecida.')}
if(b.hasAttribute('data-save-filters')){toast(save('filters',filter)?'Búsqueda guardada en este navegador.':'No se pudo guardar. La búsqueda sigue activa durante esta visita.')}
if(b.hasAttribute('data-open-filters'))openModal('Tu búsqueda.',`${filters()}<button class="btn apply" data-apply-filters>Ver ${selectedCars().length} ejemplos ${icon('arrow')}</button>`,'filter-dialog');
if(b.hasAttribute('data-apply-filters')){closeModal();setTimeout(()=>document.getElementById('result-count')?.focus({preventScroll:true}),20)}
if(b.hasAttribute('data-show-compare'))showCompare();
if(b.hasAttribute('data-clear-compare')){compare.clear();document.querySelectorAll('[data-compare]').forEach(el=>el.checked=false);updateCompare()}
if(b.hasAttribute('data-inquiry'))showInquiry(b.dataset.inquiry);
if(b.hasAttribute('data-request')){requestChoice=b.dataset.request;document.querySelectorAll('[data-request]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)))}
if(b.hasAttribute('data-prepare-query')){document.querySelector('.modal-body').innerHTML=`${icon('check')}<h3 style="margin:18px 0">Recorrido completado.</h3><p>Tema elegido: <strong>${esc(requestChoice)}</strong>.</p><p style="margin-top:14px"><strong>No se ha enviado nada.</strong> No hay datos personales, reserva ni pago. En una versión pública, este paso necesitará el contacto del vendedor y la información de privacidad correspondiente.</p><button class="btn" data-close>Cerrar ejemplo ${icon('check')}</button>`;modal.querySelector('[data-close]')?.focus()}
if(b.hasAttribute('data-gallery'))galleryView(b.dataset.gallery);
if(b.hasAttribute('data-zoom')){const c=cars.find(c=>c.id===b.dataset.zoom);openModal('Ilustración de ejemplo.',`<img src="${IMAGES[c.img]}" alt="Ilustración generada de ${c.body.toLowerCase()}, no es un vehículo a la venta">`,'lightbox')}
if(b.hasAttribute('data-scroll')){e.preventDefault();document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:motionEnabled()?'smooth':'instant',block:'start'})}
if(b.hasAttribute('data-motion')){if(systemMotion.matches){toast('El sistema tiene activado «reducir movimiento». Se respeta ese ajuste.');return}motionChoice=motionEnabled()?'off':'on';save('motion',motionChoice);applyMotion();watchReveals();toast(motionEnabled()?'Animaciones activadas.':'Animaciones pausadas.')}
if(b.hasAttribute('data-replay')){if(!motionEnabled()){toast('Las animaciones están desactivadas en tus preferencias.');return}document.querySelectorAll('.hero *, .signature-line').forEach(el=>el.getAnimations().forEach(a=>{a.cancel();a.play()}));window.scrollTo({top:0,behavior:'smooth'})}
if(b.hasAttribute('data-clear-storage')){let ok=true;for(const k of ['favorites','filters','motion'])try{localStorage.removeItem(PREFIX+k);localStorage.removeItem(PREFIX+k+'-expires')}catch{ok=false}favorites.clear();filter=freshFilter();motionChoice=null;onlyFavorites=false;document.querySelectorAll('[data-favorite-count]').forEach(el=>{el.hidden=true;el.textContent='0'});applyMotion();toast(ok?'Preferencias locales eliminadas.':'Preferencias de esta visita borradas. El navegador no permite comprobar su almacenamiento.')}
});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(a&&modal.open)closeModal()});
window.addEventListener('hashchange',()=>{if(document.startViewTransition&&motionEnabled())document.startViewTransition(()=>render(true));else render(true)});
applyMotion();render();
</script></body></html>
