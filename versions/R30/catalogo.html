<!doctype html>
<html lang="es" data-title-es="Coches · KARATS AUTO" data-title-en="Cars · KARATS AUTO" data-title-ru="Автомобили · KARATS AUTO" data-title-ca="Cotxes · KARATS AUTO">
<head>
<meta charset="utf-8">

<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#efece6">

<style>
.cmeta { flex-wrap:nowrap; } .cmeta > span#count { flex:none; } .cmeta label { flex:0 1 auto; min-width:0; } .cmeta .csort { max-width:100%; text-overflow:ellipsis; }
@media (max-width:430px) { #lFav { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); } .cfavf { padding:0 12px; } }
.cfavf { flex:none; }
.cfavf { margin-left:auto; display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 13px; border:0; border-radius:19px; background:rgba(255,255,255,.7); box-shadow:inset 0 0 0 .6px rgba(29,33,30,.12); font:inherit; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer; transition:background .25s, color .25s, transform .4s var(--spring); }
.cfavf[hidden] { display:none; } .cfavf svg { width:17px; height:17px; } .cfavf b { font-weight:700; color:#c8463b; }
.cfavf.on { background:#1d211e; color:#fff; } .cfavf.on b { color:#ffb3aa; } .cfavf:active { transform:scale(.95); }
.cfav { position:absolute; right:10px; top:10px; z-index:2; width:40px; height:40px; border:0; border-radius:50%; display:grid; place-items:center; cursor:pointer; color:#1d211e;
  background:rgba(247,245,240,.72); -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%); box-shadow:inset 0 0 0 .6px rgba(255,255,255,.8), 0 4px 14px rgba(20,22,20,.14); transition:transform .45s var(--spring); }
.cfav svg { width:20px; height:20px; } .cfav.on svg path { fill:#c8463b; stroke:#c8463b; } .cfav:active { transform:scale(.86); }
@media (prefers-reduced-motion:no-preference) { .cfav.on svg { animation:cfpop .45s var(--spring); } }
@keyframes cfpop { 0% { transform:scale(.6) } 60% { transform:scale(1.2) } 100% { transform:none } }
</style>
</head>
<body class="page">
<div class="ptop">
  <a class="gbtn lg pback" href="index.html" aria-label="Showroom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  <span class="ptitle" aria-hidden="true"></span>
  <button class="gbtn lg" id="menuBtn" type="button" aria-label="Menú" aria-expanded="false" aria-controls="menu"><i></i><i></i></button>
</div>
<div class="pwrap wide" translate="no">
  <header class="phead">
    <span class="kick">KARATS AUTO</span>
    <h1 data-t-es="Coches" data-t-en="Cars" data-t-ru="Автомобили" data-t-ca="Cotxes">Coches</h1>
    <p class="lead" data-t-es="Todos los coches que tenemos ahora. Precio final, IVA y transferencia incluidos." data-t-en="Every car we have right now. Final price, VAT and ownership transfer included." data-t-ru="Все машины, которые есть сейчас. Цена окончательная, НДС и переоформление включены." data-t-ca="Tots els cotxes que tenim ara. Preu final, IVA i transferència inclosos.">Todos los coches que tenemos ahora. Precio final, IVA y transferencia incluidos.</p>
  </header>

  <div class="cbar lg" id="cbar">
    <div class="crow">
      <input id="q" class="csearch" type="search" autocomplete="off" enterkeyhint="search">
      <button type="button" class="cfbtn" id="fbtn" aria-expanded="false" aria-controls="filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span id="fbtnT"></span><i id="fcount" hidden></i></button>
    </div>
    <div class="cfilters" id="filters">
      <div class="cfgroup"><small id="lBrand"></small><div class="cfchips" id="fBrand"></div></div>
      <div class="cfgroup"><small id="lFuel"></small><div class="cfchips" id="fFuel"></div></div>
      <div class="cfgroup"><small id="lGear"></small><div class="cfchips" id="fGear"></div></div>
      <div class="cfgroup"><small id="lPrice"></small><div class="cfrange"><input type="range" id="fPrice"><output id="oPrice"></output></div></div>
      <div class="cfgroup"><small id="lKm"></small><div class="cfrange"><input type="range" id="fKm"><output id="oKm"></output></div></div>
      <button type="button" class="cfreset" id="freset"></button>
    </div>
  </div>

  <div class="cmeta"><span id="count" aria-live="polite"></span><button type="button" class="cfavf" id="favf" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg><span id="lFav"></span><b id="nFav"></b></button>
    <label><span id="lSort" class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></span><select id="sort" class="csort"></select></label></div>
  <div class="cgrid" id="grid"></div>
  <p class="cnote" id="note"></p>
</div>
<footer data-footer></footer>
<script src="cars.js?v=r31"></script>
<script src="i18n.js?v=r35"></script>
<script src="site.js?v=r36"></script>
<script src="nav.js?v=r35"></script>
<script src="kx.js?v=r36"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id), CARS = KARATS_CARS;
  const L = () => (window.KLang && KLang.language) || 'es', tr = s => window.KLang ? KLang.translate(s) : s;
  const T = {
    es: { search:'Buscar marca o modelo', filters:'Filtros', brand:'Marca', fuel:'Combustible', gear:'Cambio', price:'Precio hasta', km:'Kilómetros hasta',
          reset:'Quitar filtros', any:'Sin límite', sort:'Ordenar', s0:'Recomendados', s1:'Precio: de menor a mayor', s2:'Precio: de mayor a menor', s3:'Menos kilómetros', s4:'Más nuevos',
          n:k => k === 1 ? '1 coche' : `${k} coches`, empty:'No hay coches con estos filtros.', fav:'Favoritos', favA:'Guardar en favoritos', favEmpty:'Aún no tienes favoritos. Toca ♥ en un coche para guardarlo.', vat:'IVA incl.',
          fuels:{ gas:'Gasolina', die:'Diésel', hyb:'Híbrido', ele:'Eléctrico' }, gears:{ a:'Automático', m:'Manual' },
          note:'Datos y fotos de ejemplo mientras preparamos la web. No es una oferta de venta.' },
    en: { search:'Search make or model', filters:'Filters', brand:'Make', fuel:'Fuel', gear:'Transmission', price:'Max price', km:'Max mileage',
          reset:'Clear filters', any:'Any', sort:'Sort', s0:'Recommended', s1:'Price: low to high', s2:'Price: high to low', s3:'Lowest mileage', s4:'Newest',
          n:k => k === 1 ? '1 car' : `${k} cars`, empty:'No cars match these filters.', fav:'Favourites', favA:'Save to favourites', favEmpty:'No favourites yet. Tap ♥ on a car to save it.', vat:'VAT incl.',
          fuels:{ gas:'Petrol', die:'Diesel', hyb:'Hybrid', ele:'Electric' }, gears:{ a:'Automatic', m:'Manual' },
          note:'Sample data and photos while we prepare the site. Not an offer for sale.' },
    ca: { search:'Cerca marca o model', filters:'Filtres', brand:'Marca', fuel:'Combustible', gear:'Canvi', price:'Preu fins a', km:'Quilòmetres fins a',
          reset:'Treure els filtres', any:'Sense límit', sort:'Ordenar', s0:'Recomanats', s1:'Preu: de més baix a més alt', s2:'Preu: de més alt a més baix', s3:'Menys quilòmetres', s4:'Més nous',
          n:k => k === 1 ? '1 cotxe' : `${k} cotxes`, empty:'No hi ha cotxes amb aquests filtres.', fav:'Preferits', favA:'Desar a preferits', favEmpty:'Encara no tens preferits. Toca ♥ en un cotxe per desar-lo.', vat:'IVA incl.',
          fuels:{ gas:'Gasolina', die:'Dièsel', hyb:'Híbrid', ele:'Elèctric' }, gears:{ a:'Automàtic', m:'Manual' },
          note:'Dades i fotos d’exemple mentre preparem el web. No és una oferta de venda.' },
    ru: { search:'Марка или модель', filters:'Фильтры', brand:'Марка', fuel:'Топливо', gear:'Коробка', price:'Цена до', km:'Пробег до',
          reset:'Сбросить фильтры', any:'Без ограничений', sort:'Сортировка', s0:'Рекомендуемые', s1:'Сначала дешевле', s2:'Сначала дороже', s3:'Меньше пробег', s4:'Новее',
          n:k => { const m10 = k % 10, m100 = k % 100; return `${k} ` + (m10 === 1 && m100 !== 11 ? 'автомобиль' : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? 'автомобиля' : 'автомобилей'); },
          empty:'Нет машин с такими фильтрами.', fav:'Избранное', favA:'В избранное', favEmpty:'В избранном пока пусто. Нажмите ♥ на машине, чтобы сохранить.', vat:'НДС вкл.',
          fuels:{ gas:'Бензин', die:'Дизель', hyb:'Гибрид', ele:'Электро' }, gears:{ a:'Автомат', m:'Механика' },
          note:'Пока сайт готовится, данные и фото демонстрационные. Это не предложение о продаже.' }
  };
  const t = k => T[L()][k];
  const fuelOf = c => /eléctr/i.test(c.fuel) ? 'ele' : /híbrid|mhev|hev/i.test(c.fuel) ? 'hyb' : /diés/i.test(c.fuel) ? 'die' : 'gas';
  const gearOf = c => /^autom/i.test(c.gear) ? 'a' : 'm';
  const brands = [...new Set(CARS.map(c => c.brand))].sort();
  const fuels = ['gas', 'die', 'hyb', 'ele'].filter(f => CARS.some(c => fuelOf(c) === f));
  const gears = ['a', 'm'].filter(g => CARS.some(c => gearOf(c) === g));
  const step = (v, s) => Math.ceil(v / s) * s;
  const PMIN = step(Math.min(...CARS.map(c => c.price)), 1000), PMAX = step(Math.max(...CARS.map(c => c.price)), 1000);
  const KMAX = step(Math.max(...CARS.map(c => c.km)), 10000);
  const S = { q:'', brand:new Set(), fuel:new Set(), gear:new Set(), price:PMAX, km:KMAX, sort:'0' };

  // state <-> URL so Back from a car page and shared links keep the filters
  function load() {
    const p = new URLSearchParams(location.search);
    S.q = p.get('q') || ''; S.sort = p.get('o') || '0';
    ['brand', 'fuel', 'gear'].forEach(k => (p.get(k) || '').split(',').filter(Boolean).forEach(v => S[k].add(v)));
    if (+p.get('p')) S.price = Math.min(PMAX, Math.max(PMIN, +p.get('p')));
    if (+p.get('km')) S.km = Math.min(KMAX, +p.get('km'));
  }
  function save() {
    const p = new URLSearchParams(location.search);
    const set = (k, v, def) => v && v !== def ? p.set(k, v) : p.delete(k);
    set('q', S.q.trim()); set('o', S.sort, '0'); ['brand', 'fuel', 'gear'].forEach(k => set(k, [...S[k]].join(',')));
    set('p', String(S.price), String(PMAX)); set('km', String(S.km), String(KMAX));
    const qs = p.toString(); history.replaceState(history.state, '', location.pathname + (qs ? '?' + qs : ''));
  }
  const chips = (el, items, key, label) => {
    el.innerHTML = items.map(v => `<button type="button" data-v="${v}" aria-pressed="${S[key].has(v)}">${label(v)}</button>`).join('');
    el.querySelectorAll('button').forEach(b => b.onclick = () => { const v = b.dataset.v; S[key].has(v) ? S[key].delete(v) : S[key].add(v); b.setAttribute('aria-pressed', S[key].has(v)); update(); });
  };
  function labels() {
    $('q').placeholder = t('search'); $('q').setAttribute('aria-label', t('search'));
    $('fbtnT').textContent = t('filters'); $('lBrand').textContent = t('brand'); $('lFuel').textContent = t('fuel'); $('lGear').textContent = t('gear');
    $('lPrice').textContent = t('price'); $('lKm').textContent = t('km'); $('freset').textContent = t('reset'); $('lSort').textContent = t('sort');
    $('sort').setAttribute('aria-label', t('sort'));
    $('sort').innerHTML = ['s0', 's1', 's2', 's3', 's4'].map((k, i) => `<option value="${i}">${t(k)}</option>`).join(''); $('sort').value = S.sort;
    chips($('fBrand'), brands, 'brand', v => v);
    chips($('fFuel'), fuels, 'fuel', v => t('fuels')[v]);
    chips($('fGear'), gears, 'gear', v => t('gears')[v]);
    $('note').textContent = t('note');
  }
  const P = $('fPrice'), K = $('fKm');
  P.min = PMIN; P.max = PMAX; P.step = 1000; K.min = 10000; K.max = KMAX; K.step = 10000;
  P.oninput = () => { S.price = +P.value; update(); }; K.oninput = () => { S.km = +K.value; update(); };
  $('q').oninput = () => { S.q = $('q').value; update(); };
  $('sort').onchange = () => { S.sort = $('sort').value; update(); };
  $('fbtn').onclick = () => { const o = $('cbar').classList.toggle('open'); $('fbtn').setAttribute('aria-expanded', o); };
  $('freset').onclick = () => { S.brand.clear(); S.fuel.clear(); S.gear.clear(); S.price = PMAX; S.km = KMAX; S.q = ''; $('q').value = ''; labels(); update(); };

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  function card(c) {
    const n = CARS.findIndex(x => x.id === c.id) + 1;               // straight into the hall, details open, at this car
    const href = (window.KLang ? KLang.url('index.html?detalle=1') : 'index.html?detalle=1') + '#' + n;
    const fav = window.KFav && KFav.has(c.id);
    const facts = [c.year, fmtKM(c.km), tr(c.fuel), tr(c.gear.split(' ')[0]), tr(c.power)].map(f => `<span>${esc(tr(String(f)))}</span>`).join('');
    return `<a class="ccar" href="${href}"><div class="img"><img src="c/${c.id}_s.webp" srcset="c/${c.id}_s.webp 600w, c/${c.id}.webp 900w" sizes="(min-width:980px) 380px, (min-width:620px) 50vw, 100vw" alt="${esc(c.brand + ' ' + c.model)}" loading="lazy" decoding="async" width="600" height="400">
      <button type="button" class="cfav${fav ? ' on' : ''}" data-fav="${c.id}" aria-pressed="${fav ? 'true' : 'false'}" aria-label="${t('favA')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg></button><span class="badge">${esc(c.label === '0' ? ({ es:'CERO', en:'ZERO', ru:'0', ca:'ZERO' })[L()] : c.label)}</span></div>
      <div class="body"><h3>${esc(c.brand + ' ' + tr(c.model))}</h3><div class="trim">${esc(tr(c.trim))}</div><div class="facts">${facts}</div>
      <div class="price"><b>${fmtEUR(c.price)}</b><small>${t('vat')}</small></div></div></a>`;
  }
  function update() {
    P.value = S.price; K.value = S.km;
    $('oPrice').textContent = S.price >= PMAX ? t('any') : fmtEUR(S.price);
    $('oKm').textContent = S.km >= KMAX ? t('any') : fmtKM(S.km);
    const q = S.q.trim().toLowerCase();
    let list = CARS.filter(c => (!S.fav || (window.KFav && KFav.has(c.id))) && (!q || `${c.brand} ${c.model} ${c.trim}`.toLowerCase().includes(q))
      && (!S.brand.size || S.brand.has(c.brand)) && (!S.fuel.size || S.fuel.has(fuelOf(c))) && (!S.gear.size || S.gear.has(gearOf(c)))
      && c.price <= S.price && c.km <= S.km);
    const by = { 1:(a, b) => a.price - b.price, 2:(a, b) => b.price - a.price, 3:(a, b) => a.km - b.km, 4:(a, b) => b.year - a.year || a.km - b.km }[S.sort];
    if (by) list = list.slice().sort(by);
    $('grid').innerHTML = list.length ? list.map(card).join('') : `<div class="cempty">${S.fav ? t('favEmpty') : t('empty')}</div>`;
    const nfav = window.KFav ? KFav.count() : 0; $('nFav').textContent = nfav || ''; $('lFav').textContent = t('fav');
    $('favf').classList.toggle('on', !!S.fav); $('favf').setAttribute('aria-pressed', !!S.fav); $('favf').hidden = !nfav && !S.fav;
    $('count').textContent = t('n')(list.length);
    const nf = S.brand.size + S.fuel.size + S.gear.size + (S.price < PMAX) + (S.km < KMAX);
    $('fcount').hidden = !nf; $('fcount').textContent = nf;
    save();
  }
  $('favf').onclick = () => { S.fav = !S.fav; update(); };
  $('grid').addEventListener('click', e => { const b = e.target.closest('[data-fav]'); if (!b) return; e.preventDefault(); e.stopPropagation();
    const on = KFav.toggle(b.dataset.fav); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    try { navigator.vibrate && navigator.vibrate(8); } catch (_) {} if (S.fav && !on) update(); else { const n = KFav.count(); $('nFav').textContent = n || ''; $('favf').hidden = !n && !S.fav; } });
  addEventListener('karats:fav', e => { if (!e.detail || !e.detail.id) update(); });
  load(); $('q').value = S.q;
  if (S.brand.size || S.fuel.size || S.gear.size || S.price < PMAX || S.km < KMAX) { $('cbar').classList.add('open'); $('fbtn').setAttribute('aria-expanded', 'true'); }
  labels(); update();
  addEventListener('karats:language', () => { labels(); update(); });
})();
</script>
</body>
</html>
