<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>404 · KARATS AUTO</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#efece6">
<link rel="stylesheet" href="/fonts/jost.css">
<style>
:root { --ink:#1d211e; --soft:#6b716c; --faint:#9aa09a; --bg:#efece6; --paper:#f7f5f0; --acc:#304c40; --spring:cubic-bezier(.3,1.35,.45,1); --ease:cubic-bezier(.22,.8,.25,1); }
* { box-sizing:border-box; margin:0; }
html, body { height:100%; }
body { background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:calc(24px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom)); text-align:center; overflow:hidden; }
.brand { position:fixed; top:calc(18px + env(safe-area-inset-top)); left:0; right:0; font-family:Jost, sans-serif; font-weight:500; letter-spacing:.22em; font-size:14px; color:var(--ink); text-decoration:none; }
.brand small { font-weight:400; color:var(--soft); margin-left:6px; letter-spacing:.3em; }
.num { display:flex; align-items:center; justify-content:center; gap:clamp(6px, 2vw, 14px); font-family:Jost, sans-serif; font-weight:300; font-size:clamp(120px, 34vw, 230px); line-height:1; letter-spacing:-.02em; user-select:none; -webkit-user-select:none; }
.wheel { width:.82em; height:.82em; touch-action:none; cursor:grab; position:relative; }
.wheel:active { cursor:grabbing; }
.wheel svg { width:100%; height:100%; display:block; will-change:transform; filter:drop-shadow(0 10px 24px rgba(20,22,20,.14)); }
.hint { margin-top:6px; font-size:13px; color:var(--faint); display:inline-flex; align-items:center; gap:6px; transition:opacity .4s; }
.hint svg { width:16px; height:16px; }
h1 { font-family:Jost, sans-serif; font-weight:400; font-size:clamp(26px, 6.4vw, 38px); line-height:1.1; margin-top:22px; }
p.sub { color:var(--soft); margin-top:8px; max-width:420px; }
.route { position:relative; width:min(320px, 80vw); height:46px; margin:22px auto 0; }
.route svg { width:100%; height:100%; overflow:visible; }
.route path { fill:none; stroke:var(--acc); stroke-width:3; stroke-linecap:round; stroke-dasharray:1 9; opacity:.35; }
.route .go { stroke-dasharray:420; stroke-dashoffset:420; opacity:1; stroke-width:3.5; }
.done .route .go { stroke-dashoffset:0; transition:stroke-dashoffset 1.1s var(--ease); }
.route .pin { fill:var(--acc); transform-origin:center; transform-box:fill-box; transform:scale(0); }
.done .route .pin { transform:scale(1); transition:transform .5s var(--spring) .9s; }
.status { height:22px; margin-top:8px; font-size:14px; font-weight:600; color:var(--acc); opacity:0; transform:translateY(6px); transition:opacity .35s, transform .5s var(--spring); }
.done .status { opacity:1; transform:none; }
.acts { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:22px; }
.btn { display:inline-flex; align-items:center; justify-content:center; height:52px; padding:0 24px; border-radius:26px; font-weight:600; font-size:16px; text-decoration:none; transition:transform .45s var(--spring), box-shadow .3s; }
.btn:active { transform:scale(.96); }
.btn.p { background:var(--acc); color:#fff; box-shadow:0 10px 24px rgba(48,76,64,.28), inset 0 1px 0 rgba(255,255,255,.18); }
.btn.g { background:rgba(255,255,255,.6); color:var(--ink); box-shadow:inset 0 0 0 .8px rgba(29,33,30,.14); }
.done .btn.p { animation:nudge .7s var(--spring) 1.2s both; }
@keyframes nudge { 0% { transform:scale(1) } 40% { transform:scale(1.06) } 100% { transform:scale(1) } }
@media (prefers-reduced-motion:reduce) { .done .route .go, .done .route .pin, .status { transition:none; } .done .btn.p { animation:none; } }
</style>
</head>
<body>
<a class="brand" href="/" translate="no">KARATS<small>AUTO</small></a>
<div class="num" aria-label="404"><span>4</span><span class="wheel" id="wheel" role="slider" aria-valuemin="-540" aria-valuemax="540" aria-valuenow="0" tabindex="0">
<svg viewBox="0 0 100 100" id="wsvg"><defs><radialGradient id="g" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#3a3f3b"/><stop offset="1" stop-color="#151816"/></radialGradient></defs>
<circle cx="50" cy="50" r="44" fill="none" stroke="url(#g)" stroke-width="10"/>
<path d="M12 46c10-3 22-5 38-5s28 2 38 5" fill="none" stroke="#1f2420" stroke-width="9" stroke-linecap="round"/>
<path d="M50 50v38" stroke="#1f2420" stroke-width="10" stroke-linecap="round"/>
<circle cx="50" cy="50" r="13" fill="#1f2420"/><circle cx="50" cy="50" r="7" fill="#304c40"/>
<text x="50" y="52.6" font-size="6.5" text-anchor="middle" fill="#cfe3d5" font-family="Jost,sans-serif" font-weight="500" letter-spacing=".6">K</text>
<rect x="47.5" y="4" width="5" height="7" rx="2" fill="#c8463b"/></svg></span><span>4</span></div>
<div class="hint" id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0114-5.3M20 4v4h-4"/></svg><span id="tHint"></span></div>
<h1 id="tTitle"></h1>
<p class="sub" id="tSub"></p>
<div class="route" aria-hidden="true"><svg viewBox="0 0 320 46"><path d="M8 38 C 70 38, 80 8, 150 8 S 240 38, 300 20"/><path class="go" d="M8 38 C 70 38, 80 8, 150 8 S 240 38, 300 20"/><circle class="pin" cx="300" cy="20" r="7"/></svg></div>
<div class="status" id="tStatus" role="status"></div>
<div class="acts"><a class="btn p" id="aHome" href="/"></a><a class="btn g" id="aCars" href="/catalogo"></a></div>
<script>
(() => {
  'use strict';
  const T = {
    es: { hint: 'Gira el volante', title: 'Esta calle no lleva a ninguna parte', sub: 'La página que buscas no existe o ha cambiado de sitio.', status: 'Ruta recalculada', home: 'Volver al showroom', cars: 'Ver los coches' },
    ca: { hint: 'Gira el volant', title: 'Aquest carrer no porta enlloc', sub: 'La pàgina que busques no existeix o ha canviat de lloc.', status: 'Ruta recalculada', home: 'Tornar al showroom', cars: 'Veure els cotxes' },
    en: { hint: 'Turn the wheel', title: 'This road leads nowhere', sub: 'The page you’re looking for doesn’t exist or has moved.', status: 'Route recalculated', home: 'Back to the showroom', cars: 'See the cars' },
    ru: { hint: 'Покрутите руль', title: 'Эта дорога никуда не ведёт', sub: 'Такой страницы нет или она переехала.', status: 'Маршрут перестроен', home: 'Вернуться в шоурум', cars: 'Смотреть машины' },
  };
  let L = 'es';
  try { L = new URLSearchParams(location.search).get('lang') || localStorage.getItem('karats.language') || (navigator.language || 'es').slice(0, 2); } catch (e) {}
  if (!T[L]) L = 'es';
  const t = T[L], $ = id => document.getElementById(id), q = L === 'es' ? '' : '?lang=' + L;
  document.documentElement.lang = L;
  $('tHint').textContent = t.hint; $('tTitle').textContent = t.title; $('tSub').textContent = t.sub; $('tStatus').textContent = t.status;
  $('aHome').textContent = t.home; $('aHome').href = '/' + q; $('aCars').textContent = t.cars; $('aCars').href = '/catalogo' + q;
  document.title = '404 · ' + t.title + ' · KARATS AUTO';

  // steering wheel: drag to turn (max 1.5 turns each way), spring back to centre on release; one big turn recalculates the route
  const W = $('wheel'), S = $('wsvg'), RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ang = 0, vel = 0, drag = null, total = 0, done = false, raf = 0;
  const MAX = 540;
  const draw = () => { S.style.transform = `rotate(${ang}deg)`; W.setAttribute('aria-valuenow', Math.round(ang)); };
  const centre = () => { const r = W.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const at = e => { const [cx, cy] = centre(); return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI; };
  const finish = () => { if (done) return; done = true; document.body.classList.add('done'); $('hint').style.opacity = 0; try { navigator.vibrate && navigator.vibrate([10, 40, 14]); } catch (e) {} };
  const spring = () => { cancelAnimationFrame(raf); if (RM) { ang = 0; draw(); return; }
    let last = performance.now();
    const step = now => { const dt = Math.min(32, now - last) / 1000; last = now;
      vel += (-ang * 90 - vel * 9) * dt; ang += vel * dt; draw();
      if (Math.abs(ang) > .2 || Math.abs(vel) > .5) raf = requestAnimationFrame(step); else { ang = 0; vel = 0; draw(); } };
    raf = requestAnimationFrame(step); };
  W.addEventListener('pointerdown', e => { cancelAnimationFrame(raf); drag = { a: at(e) }; W.setPointerCapture(e.pointerId); e.preventDefault(); });
  W.addEventListener('pointermove', e => { if (!drag) return; const a = at(e); let d = a - drag.a; if (d > 180) d -= 360; if (d < -180) d += 360; drag.a = a;
    const next = Math.max(-MAX, Math.min(MAX, ang + d)); total += Math.abs(next - ang); ang = next; draw(); if (total > 300) finish(); });
  const up = () => { if (!drag) return; drag = null; spring(); };
  W.addEventListener('pointerup', up); W.addEventListener('pointercancel', up);
  W.addEventListener('keydown', e => { const k = { ArrowLeft: -30, ArrowRight: 30 }[e.key]; if (!k) return; e.preventDefault(); cancelAnimationFrame(raf);
    ang = Math.max(-MAX, Math.min(MAX, ang + k)); total += 30; draw(); if (total > 300) finish(); clearTimeout(W.t); W.t = setTimeout(spring, 500); });
  // a gentle wiggle so people notice they can turn it
  if (!RM) setTimeout(() => { if (!drag && !total) { vel = 260; ang = 0.01; spring(); } }, 900);
  // no one turns it? recalculate anyway after a while, so the way back is obvious
  setTimeout(finish, 9000);
})();
</script>
</body>
</html>
