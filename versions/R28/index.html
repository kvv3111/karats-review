<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>KARATS AUTO · Showroom (R28)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d211e; --soft:#6b716c; --bg:#efece6; --acc:#304c40; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; max-width:100%; height:100%; background:#efece6; color:var(--ink); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #stage { position:fixed; inset:0; overflow:hidden; background:#efece6; touch-action:none; }
  #stage.hot { cursor:pointer; }
  #stage video { position:absolute; opacity:0; pointer-events:none; object-fit:fill; background:#efece6; }
  #c { position:absolute; left:0; top:0; width:100%; height:100%; display:block; pointer-events:none; }
  .fade { position:absolute; left:0; right:0; display:none; pointer-events:none; }
  .top { position:fixed; top:0; left:0; right:0; padding:calc(16px + env(safe-area-inset-top)) 26px 26px; display:flex; justify-content:space-between; align-items:center; pointer-events:none;
         background:linear-gradient(rgba(239,236,230,.82),rgba(239,236,230,0)); }
  .brand { font-family:Jost,sans-serif; font-weight:400; letter-spacing:.32em; font-size:15px; }
  .brand small { display:block; font-size:9px; letter-spacing:.6em; color:var(--soft); margin-top:1px; }
  .count { font-family:Jost,sans-serif; font-variant-numeric:tabular-nums; letter-spacing:.12em; color:var(--ink); font-size:14px; }
  .count span { color:var(--soft); }
  .side { position:fixed; top:50%; transform:translateY(-50%); width:56px; height:56px; border-radius:50%; border:1px solid rgba(29,33,30,.14);
          background:rgba(251,250,247,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:var(--ink); cursor:pointer; z-index:3;
          display:flex; align-items:center; justify-content:center; transition:opacity .3s, background .2s; box-shadow:0 6px 20px rgba(0,0,0,.08); }
  .side:hover { background:rgba(255,255,255,.92); }
  .side svg { width:22px; height:22px; }
  .side:disabled { opacity:0; pointer-events:none; }
  #prev { left:max(18px, env(safe-area-inset-left)); } #next { right:max(18px, env(safe-area-inset-right)); }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:40px 26px calc(22px + env(safe-area-inset-bottom)); display:flex; align-items:flex-end; justify-content:space-between; gap:16px; pointer-events:none;
         background:linear-gradient(rgba(239,236,230,0),rgba(239,236,230,.9) 55%); }
  .info { min-width:0; transition:opacity .35s, transform .35s; }
  .info.away { opacity:0; transform:translateY(8px); }
  .info h2 { font-family:Jost,sans-serif; font-size:26px; font-weight:500; letter-spacing:.01em; }
  .info p { color:var(--soft); margin-top:3px; }
  .info .price { color:var(--ink); font-weight:600; }
  .more { pointer-events:auto; flex:none; padding:13px 20px; border-radius:26px; border:0; background:var(--acc); color:#fff; font:inherit; font-weight:600; cursor:pointer; transition:opacity .35s; }
  .more.away { opacity:0; pointer-events:none; }
  .track { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 2px); width:150px; height:44px; z-index:3; touch-action:none; cursor:grab; -webkit-user-select:none; user-select:none; }
  .track.drag { cursor:grabbing; }
  .rail { position:absolute; left:50%; width:72px; margin-left:-36px; top:50%; height:0; }
  .rail i { position:absolute; top:-2px; width:4px; height:4px; margin-left:-2px; border-radius:2px; background:rgba(29,33,30,.28); }
  .rail .thumb { position:absolute; top:-2.5px; width:14px; height:5px; margin-left:-7px; border-radius:3px; background:var(--ink); transition:transform .2s; will-change:left; }
  .track.drag .rail .thumb { transform:scale(1.25); }
  .hint { position:fixed; left:50%; top:22%; transform:translateX(-50%); background:rgba(29,33,30,.72); color:#fff; padding:9px 16px; border-radius:20px; font-size:13px; pointer-events:none; transition:opacity .6s; white-space:nowrap; max-width:90%; }
  #load { position:fixed; left:0; top:0; height:2px; background:var(--acc); width:0; z-index:4; transition:width .2s, opacity .6s; }
  #card { position:fixed; inset:0; background:rgba(20,22,20,.45); display:none; align-items:flex-end; justify-content:center; z-index:6; }
  #card.on { display:flex; }
  #card .sheet { background:#fbfbf8; width:min(560px,100%); border-radius:18px 18px 0 0; padding:24px 22px calc(26px + env(safe-area-inset-bottom)); }
  #card h3 { font-family:Jost,sans-serif; font-weight:500; font-size:24px; }
  #card .demo { color:var(--soft); font-size:12px; margin-top:2px; }
  #card ul { list-style:none; margin:14px 0 18px; color:var(--soft); } #card li { padding:7px 0; border-bottom:1px solid #e6e5e0; display:flex; justify-content:space-between; }
  #card li b { color:var(--ink); font-weight:600; }
  #card .row { display:flex; gap:10px; } #card a, #card button { flex:1; text-align:center; padding:14px; border-radius:12px; border:0; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  #card a { background:var(--acc); color:#fff; } #card button { background:#e9e8e4; color:var(--ink); }
  .credits { position:fixed; right:26px; bottom:calc(6px + env(safe-area-inset-bottom)); font-size:10px; color:var(--soft); }
  .credits a { color:inherit; }
  @media (orientation:portrait) { .top { background:none; } .hint { top:auto; bottom:auto; } }
  @media (max-width:640px) {
    .bar { padding-bottom:calc(46px + env(safe-area-inset-bottom)); }
    .side { width:46px; height:46px; } .info h2 { font-size:21px; } .more { padding:11px 16px; }
    .credits { display:none; }
  }
</style>
</head>
<body>
<div id="stage" aria-label="Showroom KARATS AUTO">
  <video id="vf" muted playsinline preload="auto" disablepictureinpicture></video>
  <video id="vr" muted playsinline preload="auto" disablepictureinpicture></video>
  <canvas id="c"></canvas>
  <div class="fade" id="fadeA"></div><div class="fade" id="fadeB"></div>
</div>
<div id="load"></div>
<div class="top"><div class="brand">KARATS<small>AUTO</small></div><div class="count" id="count">01 <span>/ 05</span></div></div>
<button class="side" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="side" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="bar">
  <div class="info" id="info"><h2 id="name"></h2><p id="meta"></p></div>
  <button class="more" id="more">Ver coche</button>
</div>
<div class="track" id="track" aria-label="Recorrer coches"><div class="rail" id="rail"><b class="thumb" id="thumb"></b></div></div>
<div class="hint" id="hint">desliza · scroll · flechas</div>
<div class="credits">Modelos 3D: <a href="credits.html">créditos (CC BY)</a></div>
<div id="card"><div class="sheet"><h3 id="cName"></h3><div class="demo">Datos de ejemplo</div><ul id="cList"></ul><div class="row"><a href="#" onclick="return false">Contactar</a><button id="close">Cerrar</button></div></div></div>
<script>
(() => {
  // The camera move is played as a hardware-decoded VIDEO (forward + reversed copy), not as hundreds of images:
  // iPhone cannot keep ~285 big decoded images in memory, so it re-decoded them on the fly -> stutter and blank flashes.
  // At every stop a full-quality still sits on top of the video, so a parked car is pixel-sharp.
  const CARS = [
    { name: "Kia Sportage",       year: 2022, km: "38 000 km", fuel: "Gasolina MHEV", gear: "Automático", price: "27 900 €", stop: 716, still: 284 },
    { name: "BMW Serie 3",        year: 2023, km: "24 000 km", fuel: "Diésel",        gear: "Automático", price: "36 500 €", stop: 537, still: 213 },
    { name: "Toyota Corolla",     year: 2021, km: "45 000 km", fuel: "Híbrido",       gear: "Automático", price: "18 900 €", stop: 358, still: 142 },
    { name: "Hyundai Ioniq 6",    year: 2023, km: "19 000 km", fuel: "Eléctrico",     gear: "Automático", price: "34 900 €", stop: 179, still: 71  },
    { name: "Volkswagen Golf 8",  year: 2021, km: "52 000 km", fuel: "Gasolina",      gear: "Manual",     price: "21 400 €", stop: 0,   still: 0   },
  ];
  const N = 717, FPS = 60, IW = 1920, IH = 1280, BG = "#efece6";
  const HIT = { x1: 440, y1: 427, x2: 1400, y2: 973 }, FOCUS_X = (HIT.x1 + HIT.x2) / 2 / IW;
  const isPortrait = () => document.documentElement.clientHeight > document.documentElement.clientWidth * 1.05;
  const small = isPortrait();
  const CROPX = small ? 360 : 0, CW = small ? 1120 : 1920;          // phone = full-res crop around the car
  const pre = small ? "m" : "d";
  const $ = id => document.getElementById(id);
  const cv = $("c"), ctx = cv.getContext("2d", { alpha: false });
  const vf = $("vf"), vr = $("vr");                                  // vf: frame n at (n+.5)/FPS ; vr: frame n at (N-1-n+.5)/FPS
  const stills = {}; let view = { s: 1, ox: 0, oy: 0, dpr: 1, portrait: false };
  let pos = CARS[0].stop, idx = 0, mode = "idle", hopTarget = null, shown = "still", follow = pos, lastT = 0, seq = 0;
  let ready = false, readyP;

  // ---------- layout ----------
  function resize() {
    const r = document.documentElement, W0 = r.clientWidth, H0 = r.clientHeight, dpr = Math.min(3, devicePixelRatio || 1);
    cv.width = Math.round(W0 * dpr); cv.height = Math.round(H0 * dpr);
    const portrait = H0 > W0 * 1.05; let s, ox, oy;                  // s in CSS px per frame px
    if (portrait) { s = W0 / 1093; ox = W0 / 2 - FOCUS_X * IW * s; oy = H0 * 0.44 - IH * s * 0.55; }
    else {
      s = Math.max(W0 / IW, H0 / IH); ox = (W0 - IW * s) / 2;
      if (IW * s > W0) { ox = W0 / 2 - FOCUS_X * IW * s; ox = Math.min(0, Math.max(W0 - IW * s, ox)); }
      oy = (H0 - IH * s) / 2;
    }
    view = { s, ox, oy, dpr, portrait };
    for (const v of [vf, vr]) Object.assign(v.style, { left: (ox + CROPX * s) + "px", top: oy + "px", width: (CW * s) + "px", height: (IH * s) + "px" });
    const fa = $("fadeA"), fb = $("fadeB"), h = IH * s, f = Math.min(90, h * 0.16);
    if (portrait) {
      Object.assign(fa.style, { display: "block", top: "0px", height: (oy + f) + "px" });
      Object.assign(fb.style, { display: "block", top: (oy + h - f) + "px", height: (H0 - (oy + h - f)) + "px" });
      fa.style.background = `linear-gradient(${BG} ${oy / (oy + f) * 100}%, rgba(239,236,230,0))`;
      fb.style.background = `linear-gradient(rgba(239,236,230,0), ${BG} ${f / (H0 - (oy + h - f)) * 100}%)`;
      const below = oy + h;
      $("prev").style.top = $("next").style.top = (below + 34) + "px";
      $("hint").style.top = (below + 18) + "px";
    } else { fa.style.display = fb.style.display = "none"; }
    drawStill();
  }
  function drawStill() {
    const im = stills[nearestStopFrame()]; if (!im || !im.complete) return;
    const W = cv.width, H = cv.height, d = view.dpr;
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(im, (view.ox + CROPX * view.s) * d, view.oy * d, im.naturalWidth * view.s * d, IH * view.s * d);
  }
  const nearestStopFrame = () => CARS[idx].stop;
  function show(which) {                         // which layer is visible: "still" | "vf" | "vr"
    if (shown === which) return; shown = which;
    cv.style.opacity = which === "still" ? 1 : 0;
    vf.style.opacity = which === "vf" ? 1 : 0;
    vr.style.opacity = which === "vr" ? 1 : 0;
  }

  // ---------- video helpers ----------
  const tOf = (v, n) => ((v === vf ? n : N - 1 - n) + 0.5) / FPS;
  const nOf = (v, t) => { const k = Math.min(N - 1, Math.max(0, Math.floor(t * FPS + 1e-3))); return v === vf ? k : N - 1 - k; };
  const onFrame = (v, cb) => v.requestVideoFrameCallback ? v.requestVideoFrameCallback((now, m) => cb(m.mediaTime)) : requestAnimationFrame(() => cb(v.currentTime));
  function seekTo(v, n) {                        // resolves when frame n is decoded and on screen in v
    return new Promise(res => {
      if (Math.abs(nOf(v, v.currentTime) - n) < 0.5 && !v.seeking && v.readyState >= 2) return res();
      const done = () => { v.removeEventListener("seeked", done); let fin = false; const f = () => { if (!fin) { fin = true; res(); } }; onFrame(v, f); setTimeout(f, 60); };
      v.addEventListener("seeked", done); v.currentTime = tOf(v, n);
    });
  }
  async function parkVideos(n) { try { await Promise.all([seekTo(vf, n), seekTo(vr, n)]); } catch (e) {} }

  // ---------- UI ----------
  const atStop = () => mode === "idle" && pos === CARS[idx].stop;
  function ui() {
    const c = CARS[idx];
    $("count").innerHTML = `${String(idx + 1).padStart(2, "0")} <span>/ ${String(CARS.length).padStart(2, "0")}</span>`;
    $("name").textContent = c.name;
    $("meta").innerHTML = `${c.year} · ${c.km} · <span class="price">${c.price}</span>`;
    $("prev").disabled = idx === 0; $("next").disabled = idx === CARS.length - 1;
  }
  function setAway(a) { $("info").classList.toggle("away", a); $("more").classList.toggle("away", a); }
  const nearestCar = p => { let b = 0; CARS.forEach((c, k) => { if (Math.abs(c.stop - p) < Math.abs(CARS[b].stop - p)) b = k; }); return b; };

  // ---------- hop: play the rendered move at its own 24 fps, stop exactly on the car ----------
  async function go(i) {
    i = Math.max(0, Math.min(CARS.length - 1, i));
    const to = CARS[i].stop, my = ++seq;
    idx = i; ui(); hideHint(); setAway(true);
    if (to === pos && mode !== "follow") { mode = "idle"; arrive(my); return; }
    if (!ready) { await readyP; if (my !== seq) return; }
    { const cur = active(); if (cur) pos = posOf(cur); }
    const from = Math.round(pos), v = to > from ? vf : vr, other = v === vf ? vr : vf;
    mode = "hop"; hopTarget = to;
    if (shown !== "still" && shown !== (v === vf ? "vf" : "vr")) {   // scrubbing showed the other video: hold it, line this one up
      other.pause();
    }
    await seekTo(v, from); if (my !== seq) return;
    show(v === vf ? "vf" : "vr");
    v.playbackRate = Math.min(3, Math.max(1, Math.abs(to - from) / (CARS[0].stop / (CARS.length - 1)) * 0.85));
    try { await v.play(); } catch (e) {}
    const step = (mt) => {
      if (my !== seq) return;
      const n = nOf(v, mt); pos = n;
      if ((to > from && n >= to) || (to < from && n <= to) || v.ended) { v.pause(); pos = to; mode = "idle"; arrive(my); return; }
      onFrame(v, step);
    };
    onFrame(v, step);
  }
  function arrive(my) {
    drawStill(); show("still"); setAway(false);
    parkVideos(pos).then(() => {});
  }

  // ---------- scrub (wheel / finger): DRIVE the playing video instead of seeking it ----------
  // Seeking a video frame by frame is slow on phones (each seek decodes from a keyframe) -> jerky.
  // Instead the finger sets a target and the video PLAYS toward it (forward copy or reversed copy),
  // with a speed proportional to the distance: hardware playback = smooth at any speed.
  let settleT = null, switching = false;
  function scrub(df) {
    if (!ready) return;
    if (mode !== "follow") { seq++; follow = pos; mode = "follow"; }
    follow = Math.max(0, Math.min(N - 1, follow + df));
    setAway(true); hideHint();
    clearTimeout(settleT); settleT = setTimeout(() => { if (!trackDrag) go(nearestCar(follow)); }, 220);
  }
  const active = () => shown === "vf" ? vf : shown === "vr" ? vr : null;
  const posOf = v => { const k = v.currentTime * FPS - 0.5; return Math.max(0, Math.min(N - 1, v === vf ? k : N - 1 - k)); };
  function drive() {
    if (switching) return;
    const cur = active();
    if (cur) pos = posOf(cur);
    const diff = follow - pos;
    if (Math.abs(diff) < 1.2) { if (cur && !cur.paused) cur.pause(); return; }
    const want = diff > 0 ? vf : vr;
    if (cur !== want) {                                   // direction change: line the other copy up on this frame, then swap
      switching = true; if (cur) cur.pause();
      seekTo(want, Math.round(pos)).then(() => { show(want === vf ? "vf" : "vr"); switching = false; });
      return;
    }
    const rate = Math.max(0.35, Math.min(3, Math.abs(diff) / (FPS * 0.28)));
    if (Math.abs(want.playbackRate - rate) > 0.15) want.playbackRate = Math.round(rate * 8) / 8;
    if (want.paused) want.play().catch(() => {});
  }
  // ---------- dots track: thumb shows where the camera is; press + slide drives the camera ----------
  const LAST = CARS[0].stop, PER_CAR_PX = 64;                 // finger travel for one car
  const fracOf = p => 1 - p / LAST;
  let trackDrag = null, liveIdx = -1;
  function railIdx(x) { const r = $("rail").getBoundingClientRect(); return Math.max(0, Math.min(CARS.length - 1, Math.round((x - r.left) / r.width * (CARS.length - 1)))); }
  $("track").addEventListener("pointerdown", e => {
    if (!ready) return;
    e.preventDefault(); $("track").setPointerCapture(e.pointerId); $("track").classList.add("drag");
    trackDrag = { id: e.pointerId, x0: e.clientX, moved: false, p0: pos };
    hideHint(); clearTimeout(settleT); liveIdx = idx;
  });
  $("track").addEventListener("pointermove", e => {
    if (!trackDrag || e.pointerId !== trackDrag.id) return;
    const dx = e.clientX - trackDrag.x0;
    if (!trackDrag.moved && Math.abs(dx) > 6) { trackDrag.moved = true; seq++; follow = pos; trackDrag.p0 = pos; trackDrag.x0 = e.clientX; mode = "follow"; setAway(false); return; }
    if (!trackDrag.moved) return;
    // finger to the right = camera to the right (= towards lower frame numbers)
    follow = Math.max(0, Math.min(N - 1, trackDrag.p0 - (e.clientX - trackDrag.x0) / PER_CAR_PX * (LAST / (CARS.length - 1))));
    const k = nearestCar(follow); if (k !== liveIdx) { liveIdx = k; idx = k; ui(); }
  });
  function trackUp(e) {
    if (!trackDrag || e.pointerId !== trackDrag.id) return;
    const d = trackDrag; trackDrag = null; $("track").classList.remove("drag");
    if (!d.moved) { go(railIdx(e.clientX)); return; }         // tap on a dot = go to that car
    go(nearestCar(follow));
  }
  $("track").addEventListener("pointerup", trackUp); $("track").addEventListener("pointercancel", trackUp);

  function tick(t) {
    lastT = t;
    if (mode === "follow") drive();
    $("thumb").style.left = (fracOf(pos) * 100) + "%";
    requestAnimationFrame(tick);
  }
  addEventListener("wheel", e => { e.preventDefault(); if ($("card").classList.contains("on")) return; scrub(-(e.deltaY + e.deltaX) * 0.125); }, { passive: false });
  addEventListener("keydown", e => {
    if (e.key === "Escape") $("card").classList.remove("on");
    if ($("card").classList.contains("on")) return;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") go(idx + 1);
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(idx - 1);
    if (e.key === "Enter" && atStop()) openCard();
  });
  $("next").onclick = () => go(idx + 1); $("prev").onclick = () => go(idx - 1);
  $("more").onclick = () => openCard();

  // touch: swipe = next/prev car (plays the move); slow vertical drag scrubs
  let tx = 0, ty = 0, ly = 0, tmode = null, moved = false;
  const stage = $("stage");
  stage.addEventListener("touchstart", e => { const t = e.touches[0]; tx = t.clientX; ty = ly = t.clientY; tmode = null; moved = false; }, { passive: true });
  stage.addEventListener("touchmove", e => {
    const t = e.touches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if (!tmode && Math.hypot(dx, dy) > 10) tmode = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
    if (tmode === "v") { scrub((t.clientY - ly) * 179 / Math.max(320, innerWidth)); ly = t.clientY; }
    moved = moved || !!tmode;
  }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (tmode !== "h") return;
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 30) go(idx + (dx < 0 ? 1 : -1));
  });

  // tap on the parked car opens its card
  function inCar(cx, cy) { const x = (cx - view.ox) / view.s, y = (cy - view.oy) / view.s; return x > HIT.x1 && x < HIT.x2 && y > HIT.y1 && y < HIT.y2; }
  stage.addEventListener("mousemove", e => stage.classList.toggle("hot", atStop() && inCar(e.clientX, e.clientY)));
  stage.addEventListener("click", e => { if (!moved && atStop() && inCar(e.clientX, e.clientY)) openCard(); moved = false; });
  function openCard() {
    const c = CARS[idx];
    $("cName").textContent = c.name;
    const ul = $("cList"); ul.innerHTML = "";
    [["Año", c.year], ["Kilómetros", c.km], ["Combustible", c.fuel], ["Cambio", c.gear], ["Precio", c.price]].forEach(([k, v]) => {
      const li = document.createElement("li"); li.innerHTML = `<span>${k}</span><b></b>`; li.querySelector("b").textContent = v; ul.appendChild(li);
    });
    $("card").classList.add("on");
  }
  $("close").onclick = () => $("card").classList.remove("on");
  $("card").addEventListener("click", e => { if (e.target.id === "card") e.currentTarget.classList.remove("on"); });
  let hinted = false; function hideHint() { if (!hinted) { hinted = true; $("hint").style.opacity = 0; } }
  setTimeout(hideHint, 4000);

  // ---------- loading: 5 sharp stills first, then both videos fully into memory (no network during a move) ----------
  CARS.forEach((c, k) => { const d = document.createElement("i"); d.style.left = (k / (CARS.length - 1) * 100) + "%"; $("rail").insertBefore(d, $("thumb")); });
  CARS.forEach(c => { const im = new Image(); im.onload = () => { if (c.stop === CARS[idx].stop) drawStill(); }; im.src = `${small ? "m" : "f"}/${String(c.still).padStart(3, "0")}.webp`; stills[c.stop] = im; });
  async function fetchBlob(url, onp) {
    const r = await fetch(url); const total = +r.headers.get("content-length") || 0;
    if (!r.body || !total) return URL.createObjectURL(await r.blob());
    const rd = r.body.getReader(), parts = []; let got = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; onp(got / total); }
    return URL.createObjectURL(new Blob(parts, { type: "video/mp4" }));
  }
  const prog = [0, 0], bar = () => $("load").style.width = ((prog[0] + prog[1]) / 2 * 100) + "%";
  function loadVideo(v, url, k) {
    return fetchBlob(url, p => { prog[k] = p; bar(); }).then(b => new Promise(res => {
      v.src = b; v.addEventListener("loadeddata", res, { once: true }); v.load();
    }));
  }
  readyP = Promise.all([loadVideo(vf, `v/${pre}_fwd.mp4`, 0), loadVideo(vr, `v/${pre}_rev.mp4`, 1)])
    .then(() => parkVideos(pos)).then(() => { ready = true; $("load").style.opacity = 0; });
  addEventListener("resize", () => { if (isPortrait() !== small) location.reload(); else resize(); });
  resize(); ui(); requestAnimationFrame(tick);
  window.__state = () => ({ pos, idx, mode, ready, parked: atStop(), shown, vf: vf.currentTime, vr: vr.currentTime });
})();
</script>
