<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>KARATS AUTO · Showroom (R28)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d211e; --soft:#6b716c; --bg:#efece6; --acc:#304c40; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; max-width:100%; height:100%; background:#efece6; color:var(--ink); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #c { position:fixed; left:0; top:0; width:100%; height:100%; display:block; touch-action:none; }
  #c.hot { cursor:pointer; }
  .top { position:fixed; top:0; left:0; right:0; padding:calc(16px + env(safe-area-inset-top)) 26px 26px; display:flex; justify-content:space-between; align-items:center; pointer-events:none;
         background:linear-gradient(rgba(239,236,230,.82),rgba(239,236,230,0)); }
  .brand { font-family:Jost,sans-serif; font-weight:400; letter-spacing:.32em; font-size:15px; }
  .brand small { display:block; font-size:9px; letter-spacing:.6em; color:var(--soft); margin-top:1px; }
  .count { font-family:Jost,sans-serif; font-variant-numeric:tabular-nums; letter-spacing:.12em; color:var(--ink); font-size:14px; }
  .count span { color:var(--soft); }
  .side { position:fixed; top:50%; transform:translateY(-50%); width:56px; height:56px; border-radius:50%; border:1px solid rgba(29,33,30,.14);
          background:rgba(251,250,247,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:var(--ink); cursor:pointer; z-index:3;
          display:flex; align-items:center; justify-content:center; transition:opacity .3s, background .2s; box-shadow:0 6px 20px rgba(0,0,0,.08); }
  .side:hover { background:rgba(255,255,255,.92); }
  .side svg { width:22px; height:22px; }
  .side:disabled { opacity:0; pointer-events:none; }
  #prev { left:max(18px, env(safe-area-inset-left)); } #next { right:max(18px, env(safe-area-inset-right)); }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:40px 26px calc(22px + env(safe-area-inset-bottom)); display:flex; align-items:flex-end; justify-content:space-between; gap:16px; pointer-events:none;
         background:linear-gradient(rgba(239,236,230,0),rgba(239,236,230,.9) 55%); }
  .info { min-width:0; transition:opacity .35s, transform .35s; }
  .info.away { opacity:0; transform:translateY(8px); }
  .info h2 { font-family:Jost,sans-serif; font-size:26px; font-weight:500; letter-spacing:.01em; }
  .info p { color:var(--soft); margin-top:3px; }
  .info .price { color:var(--ink); font-weight:600; }
  .more { pointer-events:auto; flex:none; padding:13px 20px; border-radius:26px; border:0; background:var(--acc); color:#fff; font:inherit; font-weight:600; cursor:pointer; transition:opacity .35s; }
  .more.away { opacity:0; pointer-events:none; }
  .dots { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; gap:7px; pointer-events:none; }
  .dots i { width:6px; height:6px; border-radius:3px; background:rgba(29,33,30,.25); transition:width .3s, background .3s; }
  .dots i.on { width:18px; background:var(--ink); }
  .hint { position:fixed; left:50%; top:22%; transform:translateX(-50%); background:rgba(29,33,30,.72); color:#fff; padding:9px 16px; border-radius:20px; font-size:13px; pointer-events:none; transition:opacity .6s; white-space:nowrap; max-width:90%; }
  #load { position:fixed; left:0; top:0; height:2px; background:var(--acc); width:0; z-index:4; transition:width .2s, opacity .6s; }
  #card { position:fixed; inset:0; background:rgba(20,22,20,.45); display:none; align-items:flex-end; justify-content:center; z-index:6; }
  #card.on { display:flex; }
  #card .sheet { background:#fbfbf8; width:min(560px,100%); border-radius:18px 18px 0 0; padding:24px 22px calc(26px + env(safe-area-inset-bottom)); }
  #card h3 { font-family:Jost,sans-serif; font-weight:500; font-size:24px; }
  #card .demo { color:var(--soft); font-size:12px; margin-top:2px; }
  #card ul { list-style:none; margin:14px 0 18px; color:var(--soft); } #card li { padding:7px 0; border-bottom:1px solid #e6e5e0; display:flex; justify-content:space-between; }
  #card li b { color:var(--ink); font-weight:600; }
  #card .row { display:flex; gap:10px; } #card a, #card button { flex:1; text-align:center; padding:14px; border-radius:12px; border:0; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  #card a { background:var(--acc); color:#fff; } #card button { background:#e9e8e4; color:var(--ink); }
  .credits { position:fixed; right:26px; bottom:calc(6px + env(safe-area-inset-bottom)); font-size:10px; color:var(--soft); }
  .credits a { color:inherit; }
  @media (orientation:portrait) { .top { background:none; } .hint { top:auto; bottom:auto; } }
  @media (max-width:640px) {
    .side { width:46px; height:46px; } .info h2 { font-size:21px; } .more { padding:11px 16px; }
    .credits { display:none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Showroom KARATS AUTO"></canvas>
<div id="load"></div>
<div class="top"><div class="brand">KARATS<small>AUTO</small></div><div class="count" id="count">01 <span>/ 05</span></div></div>
<button class="side" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="side" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="bar">
  <div class="info" id="info"><h2 id="name"></h2><p id="meta"></p></div>
  <button class="more" id="more">Ver coche</button>
</div>
<div class="dots" id="dots"></div>
<div class="hint" id="hint">desliza · scroll · flechas</div>
<div class="credits">Modelos 3D: <a href="credits.html">créditos (CC BY)</a></div>
<div id="card"><div class="sheet"><h3 id="cName"></h3><div class="demo">Datos de ejemplo</div><ul id="cList"></ul><div class="row"><a href="#" onclick="return false">Contactar</a><button id="close">Cerrar</button></div></div></div>
<script>
(() => {
  // Frames = one continuous camera move along the row (rendered Golf -> Kia, 24 fps, each hop already eased in/out).
  // Cars are listed left -> right as they stand in the hall; "next" moves the camera to the right.
  const CARS = [
    { name: "Kia Sportage",       year: 2022, km: "38 000 km", fuel: "Gasolina MHEV", gear: "Automático", price: "27 900 €", stop: 284 },
    { name: "BMW Serie 3",        year: 2023, km: "24 000 km", fuel: "Diésel",        gear: "Automático", price: "36 500 €", stop: 213 },
    { name: "Toyota Corolla",     year: 2021, km: "45 000 km", fuel: "Híbrido",       gear: "Automático", price: "18 900 €", stop: 142 },
    { name: "Hyundai Ioniq 6",    year: 2023, km: "19 000 km", fuel: "Eléctrico",     gear: "Automático", price: "34 900 €", stop: 71  },
    { name: "Volkswagen Golf 8",  year: 2021, km: "52 000 km", fuel: "Gasolina",      gear: "Manual",     price: "21 400 €", stop: 0   },
  ];
  const N = 285, IW = 1920, IH = 1280, BG = "rgb(239,236,230)", BG0 = "rgba(239,236,230,0)";
  const HOP_FPS = 24;                      // frames were rendered for 24 fps: playing them 1:1 in time gives the camera's own ease
  // car on screen at a stop, in frame px: tap target and portrait focus
  const HIT = { x1: 440, y1: 427, x2: 1400, y2: 973 }, FOCUS_X = (HIT.x1 + HIT.x2) / 2 / IW;
  const isPortrait = () => document.documentElement.clientHeight > document.documentElement.clientWidth * 1.05;
  const small = isPortrait();
  const dir = small ? "m" : "f", CROPX = small ? 360 : 0;   // phone frames = full-res crop x 360..1480 around the car
  const src = i => `${dir}/${String(i).padStart(3, "0")}.webp`;
  const cv = document.getElementById("c"), ctx = cv.getContext("2d", { alpha: false });
  const $ = id => document.getElementById(id);
  const frames = new Array(N), ok = new Uint8Array(N); let nLoaded = 0;
  let pos = CARS[0].stop, idx = 0, view = { s: 1, ox: 0, oy: 0, dpr: 1 };
  // motion state: "hop" = timed playback to a stop, "follow" = smooth follow of a scrub target, "idle"
  let mode = "idle", hop = null, follow = CARS[0].stop, lastT = 0, lastDrawn = "";

  function resize() {
    // size from the canvas' real CSS box (innerWidth on iOS can be the wider layout viewport -> squashed, stale strip)
    const r = cv.getBoundingClientRect(), dpr = Math.min(3, devicePixelRatio || 1);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    const W = cv.width, H = cv.height, portrait = H > W * 1.05;
    let s, ox, oy;
    if (portrait) {                    // phone: the car fills the width, hall band, feathered top/bottom
      s = W / 1093; ox = W / 2 - FOCUS_X * IW * s; oy = H * 0.44 - IH * s * 0.55;
    } else {                           // cover, keep the car on screen
      s = Math.max(W / IW, H / IH); ox = (W - IW * s) / 2;
      if (IW * s > W) { ox = W / 2 - FOCUS_X * IW * s; ox = Math.min(0, Math.max(W - IW * s, ox)); }
      oy = (H - IH * s) / 2;
    }
    view = { s, ox, oy, dpr, portrait };
    if (portrait) {                    // arrows centred on the hall band at the screen edges, hint under the band
      const below = (oy + IH * s) / dpr;          // under the hall band, at the screen sides: never over a car
      $("prev").style.top = $("next").style.top = (below + 34) + "px";
      $("hint").style.top = (below + 18) + "px"; $("hint").style.bottom = "auto";
    }
    lastDrawn = ""; paint();
  }
  function nearestLoaded(i) { for (let d = 0; d < N; d++) { if (i - d >= 0 && ok[i - d]) return i - d; if (i + d < N && ok[i + d]) return i + d; } return -1; }
  function blit(i, a) {
    const im = frames[i]; ctx.globalAlpha = a;
    ctx.drawImage(im, view.ox + CROPX * view.s, view.oy, im.naturalWidth * view.s, IH * view.s);
  }
  function paint() {
    // between two rendered frames: cross-fade them, so 24 rendered frames/s display as smooth 60 fps motion
    const f0 = Math.floor(pos), fr = pos - f0;
    let a = nearestLoaded(f0), b = fr > 0.02 && f0 + 1 < N && ok[f0 + 1] && a === f0 ? f0 + 1 : -1;
    if (a < 0) return;
    const key = a + ":" + (b < 0 ? 0 : Math.round(fr * 32));
    if (key === lastDrawn) return; lastDrawn = key;
    const W = cv.width, H = cv.height;
    ctx.globalAlpha = 1; ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);          // clear everything: no stale strips
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    blit(a, 1); if (b >= 0) blit(b, fr);
    ctx.globalAlpha = 1;
    if (view.portrait) {
      const h = IH * view.s, f = Math.min(90 * view.dpr, h * 0.16);
      let g = ctx.createLinearGradient(0, view.oy, 0, view.oy + f); g.addColorStop(0, BG); g.addColorStop(1, BG0);
      ctx.fillStyle = g; ctx.fillRect(0, view.oy - 1, W, f + 1);
      g = ctx.createLinearGradient(0, view.oy + h - f, 0, view.oy + h); g.addColorStop(0, BG0); g.addColorStop(1, BG);
      ctx.fillStyle = g; ctx.fillRect(0, view.oy + h - f, W, f + 1);
      ctx.fillStyle = BG; ctx.fillRect(0, 0, W, Math.max(0, view.oy)); ctx.fillRect(0, view.oy + h, W, H);
    }
  }
  const atStop = () => mode === "idle" && Math.abs(pos - CARS[idx].stop) < 0.01;
  function ui() {
    const c = CARS[idx];
    $("count").innerHTML = `${String(idx + 1).padStart(2, "0")} <span>/ ${String(CARS.length).padStart(2, "0")}</span>`;
    $("name").textContent = c.name;
    $("meta").innerHTML = `${c.year} · ${c.km} · <span class="price">${c.price}</span>`;
    $("prev").disabled = idx === 0; $("next").disabled = idx === CARS.length - 1;
    [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === idx));
  }
  function setAway(a) { $("info").classList.toggle("away", a); $("more").classList.toggle("away", a); }
  const nearestCar = p => { let b = 0; CARS.forEach((c, k) => { if (Math.abs(c.stop - p) < Math.abs(CARS[b].stop - p)) b = k; }); return b; };

  function go(i) {
    idx = Math.max(0, Math.min(CARS.length - 1, i)); ui(); hideHint();
    const to = CARS[idx].stop;
    if (Math.abs(to - pos) < 0.01) { pos = to; mode = "idle"; return; }
    // play the rendered frames 1:1 in time (24 fps): the camera eases out of one stop and into the next exactly as rendered.
    // A partial hop (after a scrub) keeps the same speed; very long jumps are capped so they never drag.
    const dist = Math.abs(to - pos), dur = dist <= 75 ? dist / HOP_FPS : Math.min(dist / HOP_FPS, 1.6 + dist / 60);
    hop = { from: pos, to, t0: performance.now(), dur: dur * 1000 }; mode = "hop"; prefetch(to);
  }
  // when a hop starts from rest, frames near its ends are dense (the render eased there); a hop that starts mid-way
  // (after a scrub) gets a gentle ease-out so it does not jerk.
  function hopAt(now) {
    const u = Math.min(1, (now - hop.t0) / hop.dur);
    const fromStop = CARS.some(c => Math.abs(c.stop - hop.from) < 0.5);
    const e = fromStop ? u : 1 - Math.pow(1 - u, 3);
    return { p: hop.from + (hop.to - hop.from) * e, done: u >= 1 };
  }
  function tick(t) {
    const dt = lastT ? Math.min(0.05, (t - lastT) / 1000) : 0; lastT = t;
    if (mode === "hop") {
      const h = hopAt(t); pos = h.p;
      if (h.done) { pos = hop.to; mode = "idle"; }
    } else if (mode === "follow") {
      const k = 1 - Math.exp(-dt / 0.11);                  // critically damped follow of the finger / wheel
      pos += (follow - pos) * k;
      if (Math.abs(follow - pos) < 0.02) pos = follow;
    }
    setAway(!atStop());
    paint(); warm();
    requestAnimationFrame(tick);
  }

  // wheel / trackpad / vertical drag: scrub along the row with inertia, then glide to the nearest car
  let settleT = null;
  function scrub(df) {
    if (mode !== "follow") follow = pos;
    follow = Math.max(0, Math.min(N - 1, follow + df)); mode = "follow";
    clearTimeout(settleT); settleT = setTimeout(() => go(nearestCar(follow)), 170);
    hideHint();
  }
  addEventListener("wheel", e => { e.preventDefault(); if ($("card").classList.contains("on")) return; scrub(-(e.deltaY + e.deltaX) * 0.05); }, { passive: false });
  addEventListener("keydown", e => {
    if (e.key === "Escape") $("card").classList.remove("on");
    if ($("card").classList.contains("on")) return;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") go(idx + 1);
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") go(idx - 1);
    if (e.key === "Enter" && atStop()) openCard();
  });
  $("next").onclick = () => go(idx + 1); $("prev").onclick = () => go(idx - 1);
  $("more").onclick = () => openCard();

  // touch: the hall follows the finger; release = glide to the next car in the swipe direction (or back if barely moved)
  let tx = 0, ty = 0, lx = 0, ly = 0, tmode = null, moved = false, vx = 0, lt = 0;
  cv.addEventListener("touchstart", e => { const t = e.touches[0]; tx = lx = t.clientX; ty = ly = t.clientY; tmode = null; moved = false; vx = 0; lt = performance.now(); }, { passive: true });
  cv.addEventListener("touchmove", e => {
    const t = e.touches[0], dx = t.clientX - tx, dy = t.clientY - ty, now = performance.now();
    if (!tmode && Math.hypot(dx, dy) > 10) tmode = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
    const per = 70 / Math.max(320, cv.clientWidth);        // one screen width of drag ~ 70 frames ~ one car
    if (tmode === "h") { const d = t.clientX - lx; vx = 0.7 * vx + 0.3 * d / Math.max(1, now - lt); scrub(d * per * 1.0); lx = t.clientX; }
    if (tmode === "v") { scrub((t.clientY - ly) * per); ly = t.clientY; }
    lt = now; moved = moved || !!tmode;
  }, { passive: true });
  cv.addEventListener("touchend", e => {
    if (tmode !== "h") return;
    clearTimeout(settleT);
    const dx = e.changedTouches[0].clientX - tx, fling = Math.abs(vx) > 0.35 || Math.abs(dx) > 50;
    const p = follow; let j;
    if (fling && dx < 0) { j = CARS.findIndex(c => c.stop < p - 0.5); if (j < 0) j = CARS.length - 1; }
    else if (fling && dx > 0) { j = -1; CARS.forEach((c, k) => { if (c.stop > p + 0.5) j = k; }); if (j < 0) j = 0; }
    else j = nearestCar(p);
    pos = Math.max(0, Math.min(N - 1, pos)); go(j);
  });

  // tap on the parked car opens its card
  function inCar(cx, cy) {
    const x = (cx * view.dpr - view.ox) / view.s, y = (cy * view.dpr - view.oy) / view.s;
    return x > HIT.x1 && x < HIT.x2 && y > HIT.y1 && y < HIT.y2;
  }
  cv.addEventListener("mousemove", e => cv.classList.toggle("hot", atStop() && inCar(e.clientX, e.clientY)));
  cv.addEventListener("click", e => { if (!moved && atStop() && inCar(e.clientX, e.clientY)) openCard(); moved = false; });
  function openCard() {
    const c = CARS[idx];
    $("cName").textContent = c.name;
    const ul = $("cList"); ul.innerHTML = "";
    [["Año", c.year], ["Kilómetros", c.km], ["Combustible", c.fuel], ["Cambio", c.gear], ["Precio", c.price]].forEach(([k, v]) => {
      const li = document.createElement("li"); li.innerHTML = `<span>${k}</span><b></b>`; li.querySelector("b").textContent = v; ul.appendChild(li);
    });
    $("card").classList.add("on");
  }
  $("close").onclick = () => $("card").classList.remove("on");
  $("card").addEventListener("click", e => { if (e.target.id === "card") e.currentTarget.classList.remove("on"); });
  let hinted = false; function hideHint() { if (!hinted) { hinted = true; $("hint").style.opacity = 0; } }
  setTimeout(hideHint, 4000);

  // loading: the five stops first, then frames nearest to where the camera is / is going
  CARS.forEach(() => $("dots").appendChild(document.createElement("i")));
  const want = new Uint8Array(N); let inflight = 0, focus = pos;
  function prefetch(p) { focus = p; }
  function nextToLoad() {
    for (const c of CARS) if (!want[c.stop]) return c.stop;
    const a = mode === "hop" ? hop.from : pos, b = mode === "hop" ? hop.to : focus;
    const lo = Math.max(0, Math.floor(Math.min(a, b))), hi = Math.min(N - 1, Math.ceil(Math.max(a, b)));
    const dirn = b >= a ? 1 : -1;
    for (let k = 0; k <= hi - lo; k++) { const i = dirn > 0 ? lo + k : hi - k; if (!want[i]) return i; }
    for (let d = 1; d < N; d++) for (const i of [Math.round(pos) - d, Math.round(pos) + d]) if (i >= 0 && i < N && !want[i]) return i;
    return -1;
  }
  function pump() {
    while (inflight < 6) {
      const i = nextToLoad(); if (i < 0) return;
      want[i] = 1; inflight++;
      const im = new Image(); frames[i] = im;
      im.onload = () => {
        (im.decode ? im.decode() : Promise.resolve()).catch(() => {}).then(() => {
          ok[i] = 1; nLoaded++; inflight--; $("load").style.width = (nLoaded / N * 100) + "%";
          if (nLoaded === N) $("load").style.opacity = 0;
          if (Math.abs(i - pos) < 2) lastDrawn = "";
          pump();
        });
      };
      im.onerror = () => { inflight--; want[i] = 0; setTimeout(pump, 500); };
      im.src = src(i);
    }
  }
  // keep the frames just ahead decoded (Safari drops decoded bitmaps of far frames)
  let warmAt = -99;
  function warm() {
    const p = Math.round(pos); if (Math.abs(p - warmAt) < 3) return; warmAt = p;
    const d = mode === "hop" ? Math.sign(hop.to - hop.from) : 0;
    for (let k = 1; k <= 8; k++) { const i = p + (d || 1) * k; if (i >= 0 && i < N && ok[i] && frames[i].decode) frames[i].decode().catch(() => {}); }
  }
  pump();
  addEventListener("resize", () => { if (isPortrait() !== small) location.reload(); else resize(); });
  resize(); ui(); requestAnimationFrame(tick);
  window.__state = () => ({ pos, idx, mode, loaded: nLoaded, parked: atStop(), cw: cv.width, bw: Math.round(cv.getBoundingClientRect().width) });
})();
</script>
</body>
</html>
