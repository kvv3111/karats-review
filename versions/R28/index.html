<style>
  :root { --ink:#1d211e; --soft:#6b716c; --bg:#efece6; --acc:#304c40; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body, button, a, .side, .more, #card { touch-action:manipulation; }
  html,body { width:100%; max-width:100%; height:100%; background:#efece6; color:var(--ink); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #stage { position:fixed; inset:0; overflow:hidden; background:#efece6; touch-action:none; }
  #stage.hot { cursor:pointer; }
  #stage video { position:absolute; opacity:0; pointer-events:none; object-fit:fill; background:#efece6; }
  #c { position:absolute; left:0; top:0; width:100%; height:100%; display:block; pointer-events:none; }
  .fade { position:absolute; left:0; right:0; display:none; pointer-events:none; }
  .top { position:fixed; top:0; left:0; right:0; padding:calc(16px + env(safe-area-inset-top)) 26px 26px; display:flex; justify-content:space-between; align-items:center; pointer-events:none;
         background:linear-gradient(rgba(239,236,230,.82),rgba(239,236,230,0)); }
  .brand { font-family:Jost,sans-serif; font-weight:400; letter-spacing:.34em; font-size:clamp(17px, 1.55vw, 30px); line-height:1.1; }
  .brand { display:inline-block; text-align:center; }
  .brand span { margin-right:-.34em; }                         /* letter-spacing adds space after the last letter: cancel it so both lines centre */
  .brand small { display:block; font-size:.38em; letter-spacing:.9em; margin-right:-.9em; color:var(--soft); margin-top:.5em; }
  .count { font-family:Jost,sans-serif; font-variant-numeric:tabular-nums; letter-spacing:.12em; color:var(--ink); font-size:14px; }
  .count span { color:var(--soft); }
  .side { position:fixed; top:50%; transform:translateY(-50%); width:56px; height:56px; border-radius:50%; border:1px solid rgba(29,33,30,.14);
          background:rgba(251,250,247,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:var(--ink); cursor:pointer; z-index:3;
          display:flex; align-items:center; justify-content:center; transition:opacity .3s, background .2s; box-shadow:0 6px 20px rgba(0,0,0,.08); }
  .side:hover { background:rgba(255,255,255,.92); }
  .side svg { width:22px; height:22px; }
  .side:disabled { opacity:0; pointer-events:none; }
  #prev { left:max(18px, env(safe-area-inset-left)); } #next { right:max(18px, env(safe-area-inset-right)); }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:40px 26px calc(22px + env(safe-area-inset-bottom)); display:flex; align-items:flex-end; justify-content:space-between; gap:16px; pointer-events:none;
         background:linear-gradient(rgba(239,236,230,0),rgba(239,236,230,.9) 55%); }
  .info { min-width:0; transition:opacity .35s, transform .35s; }
  .info.away { opacity:0; transform:translateY(8px); }
  .info h2 { font-family:Jost,sans-serif; font-size:26px; font-weight:500; letter-spacing:.01em; }
  .info p { color:var(--soft); margin-top:3px; }
  .info .price { color:var(--ink); font-weight:600; }
  .more { pointer-events:auto; flex:none; padding:13px 20px; border-radius:26px; border:0; background:var(--acc); color:#fff; font:inherit; font-weight:600; cursor:pointer; transition:opacity .35s; }
  .more.away { opacity:0; pointer-events:none; }
  /* dots track = Liquid Glass capsule (iOS 26 style): frosted blur + saturation, specular rim, refraction on Chromium */
  .track { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 14px); width:176px; height:56px; z-index:3; touch-action:none; cursor:grab; -webkit-user-select:none; user-select:none; }
  .track.drag { cursor:grabbing; }
  .glass { position:absolute; left:50%; top:50%; width:132px; height:34px; margin:-17px 0 0 -66px; border-radius:17px; overflow:hidden; isolation:isolate;
           box-shadow:0 8px 22px rgba(20,22,20,.16), 0 1px 3px rgba(20,22,20,.10);
           transition:transform .45s cubic-bezier(.3,1.6,.45,1), box-shadow .3s; will-change:transform; }
  #lensWrap { position:fixed; left:0; top:0; width:62px; height:46px; z-index:4; pointer-events:none; border-radius:23px;
              opacity:0; transform:scale(.45, .5); transition:transform .42s cubic-bezier(.25,1.55,.4,1), opacity .18s ease; will-change:transform,left; }
  #lensWrap canvas { width:100%; height:100%; display:block; border-radius:23px; }
  .lens__rim { position:absolute; inset:0; border-radius:23px;
               box-shadow: inset 0 0 0 .7px rgba(20,22,20,.45), inset 0 1.2px .5px rgba(255,255,255,.85), inset 0 -1px .5px rgba(255,255,255,.45),
                           0 6px 16px rgba(20,22,20,.20), 0 1px 3px rgba(20,22,20,.12); }
  .track.lens ~ #lensWrap { opacity:1; transform:none; }
  .track.lens .rail .thumb { opacity:0; }
  .rail .thumb { transition:opacity .15s; }
  .track.drag .glass { transform:scale(1.06, 1.04); box-shadow:0 12px 30px rgba(20,22,20,.20), 0 2px 6px rgba(20,22,20,.10); }
  .glass > span { position:absolute; inset:0; border-radius:inherit; pointer-events:none; }
  .glass__refract { -webkit-backdrop-filter:blur(10px) saturate(185%) brightness(1.06); backdrop-filter:blur(10px) url(#lg-refract) saturate(185%) brightness(1.06); }
  .glass__tint { background:linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.06) 55%, rgba(255,255,255,.14)); }
  .glass__specular { box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(255,255,255,.30), inset 0 0 0 .5px rgba(255,255,255,.45), inset 0 -6px 10px rgba(255,255,255,.10), inset 0 -1.5px 3px rgba(40,36,30,.10); }
  .glass__shine { background:radial-gradient(120% 90% at 30% -20%, rgba(255,255,255,.45), rgba(255,255,255,0) 55%); mix-blend-mode:screen; opacity:.8; }
  .rail { position:absolute; left:50%; width:84px; margin-left:-42px; top:50%; height:0; z-index:2; }
  .rail i { position:absolute; top:-2.5px; width:5px; height:5px; margin-left:-2.5px; border-radius:3px; background:rgba(29,33,30,.30); }
  .rail .thumb { position:absolute; top:-3px; width:16px; height:6px; margin-left:-8px; border-radius:3px; background:rgba(29,33,30,.88); box-shadow:0 1px 2px rgba(0,0,0,.18); will-change:left; }
  .hint { position:fixed; left:50%; top:22%; transform:translateX(-50%); background:rgba(29,33,30,.72); color:#fff; padding:9px 16px; border-radius:20px; font-size:13px; pointer-events:none; transition:opacity .6s; white-space:nowrap; max-width:90%; }
  #load { position:fixed; left:0; top:0; height:2px; background:var(--acc); width:0; z-index:4; transition:width .2s, opacity .6s; }
  #card { position:fixed; inset:0; background:rgba(20,22,20,.45); display:none; align-items:flex-end; justify-content:center; z-index:6; }
  #card.on { display:flex; }
  #card .sheet { background:#fbfbf8; width:min(560px,100%); border-radius:18px 18px 0 0; padding:24px 22px calc(26px + env(safe-area-inset-bottom)); }
  #card h3 { font-family:Jost,sans-serif; font-weight:500; font-size:24px; }
  #card .demo { color:var(--soft); font-size:12px; margin-top:2px; }
  #card ul { list-style:none; margin:14px 0 18px; color:var(--soft); } #card li { padding:7px 0; border-bottom:1px solid #e6e5e0; display:flex; justify-content:space-between; }
  #card li b { color:var(--ink); font-weight:600; }
  #card .row { display:flex; gap:10px; } #card a, #card button { flex:1; text-align:center; padding:14px; border-radius:12px; border:0; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  #card a { background:var(--acc); color:#fff; } #card button { background:#e9e8e4; color:var(--ink); }
  .credits { position:fixed; right:26px; bottom:calc(6px + env(safe-area-inset-bottom)); font-size:10px; color:var(--soft); }
  .credits a { color:inherit; }
  @media (orientation:portrait) { .top { background:none; } .hint { top:auto; bottom:auto; } }
  @media (max-width:640px) {
    .side { width:46px; height:46px; } .info h2 { font-size:21px; } .more { padding:11px 16px; }
    .credits { display:none; }
  }

<script>
(() => {
  // The camera move is played as a hardware-decoded VIDEO (forward + reversed copy), not as hundreds of images:
  // iPhone cannot keep ~285 big decoded images in memory, so it re-decoded them on the fly -> stutter and blank flashes.
  // At every stop a full-quality still sits on top of the video, so a parked car is pixel-sharp.
  const CARS = [
    { name: "Kia Sportage",       year: 2022, km: "38 000 km", fuel: "Gasolina MHEV", gear: "Automático", price: "27 900 €", stop: 716, still: 284 },
    { name: "BMW Serie 3",        year: 2023, km: "24 000 km", fuel: "Diésel",        gear: "Automático", price: "36 500 €", stop: 537, still: 213 },
    { name: "Toyota Corolla",     year: 2021, km: "45 000 km", fuel: "Híbrido",       gear: "Automático", price: "18 900 €", stop: 358, still: 142 },
    { name: "Hyundai Ioniq 6",    year: 2023, km: "19 000 km", fuel: "Eléctrico",     gear: "Automático", price: "34 900 €", stop: 179, still: 71  },
    { name: "Volkswagen Golf 8",  year: 2021, km: "52 000 km", fuel: "Gasolina",      gear: "Manual",     price: "21 400 €", stop: 0,   still: 0   },
  ];
  const N = 717, FPS = 60, IW = 1920, IH = 1280, BG = "#efece6";
  const HIT = { x1: 440, y1: 427, x2: 1400, y2: 973 }, FOCUS_X = (HIT.x1 + HIT.x2) / 2 / IW;
  const isPortrait = () => document.documentElement.clientHeight > document.documentElement.clientWidth * 1.05;
  const small = isPortrait();
  const CROPX = small ? 360 : 0, CW = small ? 1120 : 1920;          // phone = full-res crop around the car
  const pre = small ? "m" : "d";
  const $ = id => document.getElementById(id);
  const cv = $("c"), ctx = cv.getContext("2d", { alpha: false });
  let vf = $("vf"), vr = $("vr");                                  // vf: frame n at (n+.5)/FPS ; vr: frame n at (N-1-n+.5)/FPS
  const stills = {}; let view = { s: 1, ox: 0, oy: 0, dpr: 1, portrait: false };
  const hashIdx = (() => { const m = /^#(\d)$/.exec(location.hash); return m ? Math.max(0, Math.min(CARS.length - 1, +m[1] - 1)) : 0; })();
  let pos = CARS[hashIdx].stop, idx = hashIdx, mode = "idle", hopTarget = null, shown = "still", follow = pos, lastT = 0, seq = 0;
  let noPlay = false;
  let ready = false, readyP;

  // ---------- layout ----------
  function resize() {
    const r = document.documentElement, W0 = r.clientWidth, H0 = r.clientHeight, dpr = Math.min(3, devicePixelRatio || 1);
    cv.width = Math.round(W0 * dpr); cv.height = Math.round(H0 * dpr);
    const portrait = H0 > W0 * 1.05; let s, ox, oy;                  // s in CSS px per frame px
    if (portrait) { s = W0 / 1093; ox = W0 / 2 - FOCUS_X * IW * s; oy = H0 * 0.44 - IH * s * 0.55; }
    else {
      s = Math.max(W0 / IW, H0 / IH); ox = (W0 - IW * s) / 2;
      if (IW * s > W0) { ox = W0 / 2 - FOCUS_X * IW * s; ox = Math.min(0, Math.max(W0 - IW * s, ox)); }
      oy = (H0 - IH * s) / 2;
    }
    view = { s, ox, oy, dpr, portrait };
    for (const v of [vf, vr]) Object.assign(v.style, { left: (ox + CROPX * s) + "px", top: oy + "px", width: (CW * s) + "px", height: (IH * s) + "px" });
    const fa = $("fadeA"), fb = $("fadeB"), h = IH * s, f = Math.min(90, h * 0.16);
    if (portrait) {
      Object.assign(fa.style, { display: "block", top: "0px", height: (oy + f) + "px" });
      Object.assign(fb.style, { display: "block", top: (oy + h - f) + "px", height: (H0 - (oy + h - f)) + "px" });
      fa.style.background = `linear-gradient(${BG} ${oy / (oy + f) * 100}%, rgba(239,236,230,0))`;
      fb.style.background = `linear-gradient(rgba(239,236,230,0), ${BG} ${f / (H0 - (oy + h - f)) * 100}%)`;
      const below = oy + h;
      $("prev").style.top = $("next").style.top = (below + 34) + "px";
      $("hint").style.top = (below + 18) + "px";
      $("track").style.top = (below - 88) + "px"; $("track").style.bottom = "auto";   // glass capsule over the floor: it has something to refract
    } else { fa.style.display = fb.style.display = "none"; }
    drawStill();
  }
  function drawStill() {
    const im = stills[nearestStopFrame()]; if (!im || !im.complete) return;
    const W = cv.width, H = cv.height, d = view.dpr;
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(im, (view.ox + CROPX * view.s) * d, view.oy * d, im.naturalWidth * view.s * d, IH * view.s * d);
  }
  const nearestStopFrame = () => CARS[idx].stop;
  function show(which) {                         // which layer is visible: "still" | "vf" | "vr"
    if (shown === which) return; shown = which;
